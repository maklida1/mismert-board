<!-- טעינת ספריות Firebase CDN (גרסת SDK v8 המקבלת את firebase גלובלי) -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
  // השוואה עמוקה שלא רגישה לסדר מפתחות - Firebase לא תמיד שומר על סדר המפתחות המקורי
  function deepEqual(a, b) {
    if (a === b) return true;
    if (typeof a !== 'object' || typeof b !== 'object' || a === null || b === null) return false;
    if (Array.isArray(a) !== Array.isArray(b)) return false;
    const keysA = Object.keys(a);
    const keysB = Object.keys(b);
    if (keysA.length !== keysB.length) return false;
    for (const key of keysA) {
      if (!deepEqual(a[key], b[key])) return false;
    }
    return true;
  }

  const firebaseConfig = {
    apiKey: "AIzaSyBtUvDSrt9-jCorJR0avkNqC4qySmyaNfM",
    authDomain: "mismert-8952a.firebaseapp.com",
    databaseURL: "https://mismert-8952a-default-rtdb.firebaseio.com",
    projectId: "mismert-8952a",
    storageBucket: "mismert-8952a.firebasestorage.app",
    messagingSenderId: "148589046902",
    appId: "1:148589046902:web:d926763430bb8d13ed4357",
    measurementId: "G-HXQV8HNV6N"
  };

  let database = null;

  // אתחול Firebase - עטוף ב-try/catch כדי שאם הטעינה נכשלת (למשל אין אינטרנט) הדף לא יישבר
  try {
    firebase.initializeApp(firebaseConfig);
    database = firebase.database();
    // סנכרון בזמן אמת מול Firebase עם השלמת רשימות ריקות
    database.ref('boardState').on('value', (snapshot) => {
      const data = snapshot.val();
      if (data && Array.isArray(data.categories)) {
        // Firebase מוחק מערכים ריקים, אז אנחנו משלימים אותם כאן כדי שהקוד לא יישבר
        data.categories.forEach(cat => {
          if (!cat.questions) cat.questions = [];
          if (['cat1', 'cat2', 'cat3', 'cat-night'].includes(cat.id)) cat.permanent = true;
          cat.questions.forEach(q => {
            if (!q.comments) q.comments = [];
            if (!q.commentMarks) q.commentMarks = [];
            if (!q.commentNights) q.commentNights = [];
            if (!q.commentNightsOn) q.commentNightsOn = [];
          });
        });
        // Firebase מחזיר אלינו הד של הכתיבה שלנו עצמנו - אם הנתונים זהים למה שכבר יש,
        // מדובר בהד ולא בשינוי אמיתי ממישהו אחר, אז מדלגים על render() כדי לא לאפס פוקוס/חצים
        if (deepEqual(data, state)) return;
        state = data;
        render();
      } else if (!data) {
        // מסד הנתונים ריק לגמרי (פעם ראשונה) - נשמור את ברירת המחדל כדי שכל המכשירים יתחילו מאותה נקודה
        saveStateToFirebase();
      } else {
        console.error('Ignoring malformed data from Firebase:', data);
      }
    }, (err) => {
      console.error('Firebase read failed (check your database Rules):', err);
    });
  } catch (err) {
    console.error('Firebase init failed:', err);
  }

  // פונקציה לשמירה בכל שינוי
  function saveStateToFirebase() {
    if (!database) return;
    database.ref('boardState').set(state).catch((err) => {
      console.error('Firebase SAVE failed (check your database Rules for write access):', err);
    });
  }
</script>

<h1>שאלות ובקשות משמרת</h1>

<div id="board"></div>

<script>
let state = {
  categories: [
    {
      id: 'cat1',
      title: 'קוליות',
      questions: [],
      permanent: true
    },
    {
      id: 'cat2',
      title: 'מיילים',
      questions: [],
      permanent: true
    },
    {
      id: 'cat3',
      title: 'מרקטמן',
      questions: [],
      permanent: true
    },
    {
      id: 'cat-night',
      title: 'בקשות נייט',
      questions: [],
      mode: 'night',
      permanent: true
    }
  ]
};

let lastFocusCatId = null;
let lastFocusNewQid = null;
let lastFocusCommentQid = null;
let lastFocusCommentIdx = null;
let lastFocusNightQid = null;
let lastFocusNightIdx = null;
let navOrder = [];
let flatNav = [];

function isCaretOnFirstLine(el){
  const sel = window.getSelection();
  if(!sel.rangeCount) return true;
  const range = sel.getRangeAt(0).cloneRange();
  range.collapse(true);
  let rects = range.getClientRects();
  if(rects.length === 0) rects = [el.getBoundingClientRect()];
  const caretRect = rects[0];
  const elRect = el.getBoundingClientRect();
  return (caretRect.top - elRect.top) < (caretRect.height / 2 + 2);
}
function isCaretOnLastLine(el){
  const sel = window.getSelection();
  if(!sel.rangeCount) return true;
  const range = sel.getRangeAt(0).cloneRange();
  range.collapse(true);
  let rects = range.getClientRects();
  if(rects.length === 0) rects = [el.getBoundingClientRect()];
  const caretRect = rects[0];
  const elRect = el.getBoundingClientRect();
  return (elRect.bottom - caretRect.bottom) < (caretRect.height / 2 + 2);
}
function normalizeEmptyOnBlur(el){
  if(el.textContent.trim() === '' && !el.querySelector('img') && el.innerHTML !== ''){
    el.innerHTML = '';
  }
}

function getCaretOffset(el){
  const sel = window.getSelection();
  if(sel.rangeCount === 0) return 0;
  const range = sel.getRangeAt(0);
  if(!el.contains(range.startContainer)) return 0;
  const preRange = document.createRange();
  preRange.selectNodeContents(el);
  preRange.setEnd(range.startContainer, range.startOffset);
  return preRange.toString().length;
}
function placeCaretAtEnd(el){
  const range = document.createRange();
  const sel = window.getSelection();
  range.selectNodeContents(el);
  range.collapse(false);
  sel.removeAllRanges();
  sel.addRange(range);
}
function placeCaretAtStart(el){
  const range = document.createRange();
  const sel = window.getSelection();
  range.selectNodeContents(el);
  range.collapse(true);
  sel.removeAllRanges();
  sel.addRange(range);
}
function focusFieldEnd(qid, col){
  const el = document.querySelector(`[data-qid="${qid}"][data-col="${col}"]`);
  if(!el) return;
  el.focus();
  placeCaretAtEnd(el);
}
function focusFieldStart(qid, col){
  const el = document.querySelector(`[data-qid="${qid}"][data-col="${col}"]`);
  if(!el) return;
  el.focus();
  placeCaretAtStart(el);
}
function queryFlatEl(item, columnType){
  if(item.idx === null || item.idx === undefined){
    const col = columnType === 'primary' ? 'text' : 'answer';
    return document.querySelector(`[data-qid="${item.qid}"][data-col="${col}"]`);
  }
  const col = columnType === 'primary' ? 'comment' : 'commentNight';
  return document.querySelector(`[data-qid="${item.qid}"][data-col="${col}"][data-idx="${item.idx}"]`);
}
function focusFlatItemAt(item, columnType, atStart){
  if(!item) return false;
  if(item.qid === null){
    const el = document.getElementById('add-input-' + item.catId);
    if(!el) return false;
    el.focus();
    if(atStart) placeCaretAtStart(el); else placeCaretAtEnd(el);
    return true;
  }
  let el = queryFlatEl(item, columnType);
  if(!el && columnType === 'secondary'){
    el = queryFlatEl(item, 'primary');
  }
  if(!el) return false;
  el.focus();
  if(atStart) placeCaretAtStart(el); else placeCaretAtEnd(el);
  return true;
}
function focusFlatItem(item, columnType){
  return focusFlatItemAt(item, columnType, false);
}
function flatIndexOf(qid, idx){
  const normIdx = (idx === undefined) ? null : idx;
  return flatNav.findIndex(item => item.qid === qid && item.idx === normIdx);
}
function moveFlatVertical(qid, idx, columnType, dir){
  const pos = flatIndexOf(qid, idx);
  if(pos === -1) return;
  const newPos = pos + dir;
  if(newPos < 0 || newPos >= flatNav.length) return;
  focusFlatItem(flatNav[newPos], columnType);
}
function handleFieldNav(e, qid, idx, columnType){
  const el = e.currentTarget;
  const normIdx = (idx === undefined) ? null : idx;
  if(e.key === 'ArrowUp'){
    if(isCaretOnFirstLine(el)){
      e.preventDefault();
      moveFlatVertical(qid, normIdx, columnType, -1);
    }
  } else if(e.key === 'ArrowDown'){
    if(isCaretOnLastLine(el)){
      e.preventDefault();
      moveFlatVertical(qid, normIdx, columnType, 1);
    }
  } else if(e.key === 'ArrowRight'){
    if(getCaretOffset(el) === el.textContent.length){
      if(columnType === 'primary'){
        const moved = focusFlatItemAt({qid, idx: normIdx}, 'secondary', true);
        if(moved) e.preventDefault();
      } else {
        const pos = flatIndexOf(qid, normIdx);
        if(pos !== -1 && pos + 1 < flatNav.length){
          const moved = focusFlatItemAt(flatNav[pos + 1], 'primary', true);
          if(moved) e.preventDefault();
        }
      }
    }
  } else if(e.key === 'ArrowLeft'){
    if(getCaretOffset(el) === 0){
      if(columnType === 'secondary'){
        const moved = focusFlatItemAt({qid, idx: normIdx}, 'primary', false);
        if(moved) e.preventDefault();
      } else {
        const pos = flatIndexOf(qid, normIdx);
        if(pos > 0){
          const moved = focusFlatItemAt(flatNav[pos - 1], 'secondary', false);
          if(moved) e.preventDefault();
        }
      }
    }
  }
}

function focusPrevCategoryEnd(idx){
  if(idx < 0) return;
  const cat = state.categories[idx];
  if(cat.questions.length > 0){
    focusFieldEnd(cat.questions[cat.questions.length - 1].id, 'text');
  } else {
    focusPrevCategoryEnd(idx - 1);
  }
}

function handleAddInputNav(e, catId){
  if(e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
  e.preventDefault();
  const catIndex = state.categories.findIndex(c => c.id === catId);
  if(e.key === 'ArrowUp'){
    const cat = state.categories[catIndex];
    if(cat.questions.length > 0){
      focusFieldEnd(cat.questions[cat.questions.length - 1].id, 'text');
    } else {
      focusPrevCategoryEnd(catIndex - 1);
    }
  } else {
    if(catIndex < state.categories.length - 1){
      const nextCat = state.categories[catIndex + 1];
      if(nextCat.questions.length > 0){
        focusFieldEnd(nextCat.questions[0].id, 'text');
      } else {
        const nextInput = document.getElementById('add-input-' + nextCat.id);
        if(nextInput) nextInput.focus();
      }
    }
  }
}

function insertLineBreakAtCaret(){
  document.execCommand('insertLineBreak', false, null);
}

function attachImagePaste(el, onChange){
  el.addEventListener('paste', (e) => {
    const items = (e.clipboardData && e.clipboardData.items) || [];
    let imageItem = null;
    for(let i = 0; i < items.length; i++){
      if(items[i].type && items[i].type.indexOf('image/') === 0){
        imageItem = items[i];
        break;
      }
    }
    e.preventDefault();
    if(imageItem){
      const file = imageItem.getAsFile();
      const reader = new FileReader();
      reader.onload = () => {
        document.execCommand('insertImage', false, reader.result);
        if(onChange) onChange();
      };
      reader.readAsDataURL(file);
    } else {
      const text = (e.clipboardData && e.clipboardData.getData('text/plain')) || '';
      document.execCommand('insertText', false, text);
      if(onChange) onChange();
    }
  });
}

function uid(prefix){
  return prefix + '_' + Math.random().toString(36).slice(2,9);
}

function addCategory(inputId){
  const input = document.getElementById(inputId || 'new-cat-input');
  if(!input) return;
  const title = input.value.trim();
  if(!title) return;
  state.categories.push({id: uid('cat'), title: title, questions: []});
  input.value = '';
  render();
  saveStateToFirebase();
}

let pendingDeleteCatId = null;

function moveCategoryUp(catId){
  const idx = state.categories.findIndex(c => c.id === catId);
  if(idx <= 0) return;
  const tmp = state.categories[idx - 1];
  state.categories[idx - 1] = state.categories[idx];
  state.categories[idx] = tmp;
  render();
  saveStateToFirebase();
}

function moveCategoryDown(catId){
  const idx = state.categories.findIndex(c => c.id === catId);
  if(idx === -1 || idx >= state.categories.length - 1) return;
  const tmp = state.categories[idx + 1];
  state.categories[idx + 1] = state.categories[idx];
  state.categories[idx] = tmp;
  render();
  saveStateToFirebase();
}

function deleteCategory(catId){
  const cat = state.categories.find(c => c.id === catId);
  if(cat && cat.permanent) return;
  pendingDeleteCatId = catId;
  render();
}

function confirmDeleteCategory(){
  if(!pendingDeleteCatId) return;
  state.categories = state.categories.filter(c => c.id !== pendingDeleteCatId);
  pendingDeleteCatId = null;
  render();
  saveStateToFirebase();
}

function cancelDeleteCategory(){
  pendingDeleteCatId = null;
  render();
}

let pendingClear = null;

function clearQuestions(catId){
  const cat = state.categories.find(c => c.id === catId);
  if(!cat || cat.questions.length === 0) return;

  let mainCounter = 0;
  const notDoneNumbers = [];
  cat.questions.forEach(q => {
    if(!q.sub) mainCounter++;
    if(!q.done){
      notDoneNumbers.push(q.sub ? (mainCounter + '+') : String(mainCounter));
    }
  });

  if(notDoneNumbers.length > 0){
    pendingClear = {catId, notDoneNumbers};
    render();
    return;
  }

  cat.questions = [];
  render();
  saveStateToFirebase();
}

function confirmClearQuestions(){
  if(!pendingClear) return;
  const cat = state.categories.find(c => c.id === pendingClear.catId);
  pendingClear = null;
  if(cat) cat.questions = [];
  render();
  saveStateToFirebase();
}

function cancelClearQuestions(){
  pendingClear = null;
  render();
}

function addQuestion(catId, html){
  const cat = state.categories.find(c => c.id === catId);
  if(!cat) return;
  const temp = document.createElement('div');
  temp.innerHTML = html || '';
  const hasImage = !!temp.querySelector('img');
  const hasText = temp.textContent.trim().length > 0;
  if(!hasText && !hasImage) return;
  cat.questions.push({id: uid('q'), text: html || '', answer: '', sub: false, done: false, comments: [], textMark: null, commentMarks: [], commentNights: [], commentNightsOn: []});
  render();
  saveStateToFirebase();
}

function toggleIndent(catId, qId){
  const cat = state.categories.find(c => c.id === catId);
  const q = cat.questions.find(q => q.id === qId);
  q.sub = !q.sub;
  render();
  saveStateToFirebase();
}

function addSubQuestionAfter(catId, qId){
  const cat = state.categories.find(c => c.id === catId);
  const idx = cat.questions.findIndex(q => q.id === qId);
  if(idx === -1) return;
  const newQ = {id: uid('q'), text: '', answer: '', sub: true, done: false, comments: [], textMark: null, commentMarks: [], commentNights: [], commentNightsOn: []};
  cat.questions.splice(idx + 1, 0, newQ);
  lastFocusNewQid = newQ.id;
  render();
  saveStateToFirebase();
}

function toggleDone(catId, qId){
  const cat = state.categories.find(c => c.id === catId);
  const q = cat.questions.find(q => q.id === qId);
  q.done = !q.done;
  render();
  saveStateToFirebase();
}

let pendingDeleteQid = null;

function deleteQuestion(catId, qId){
  const cat = state.categories.find(c => c.id === catId);
  const q = cat.questions.find(q => q.id === qId);
  if(q && !q.done){
    pendingDeleteQid = qId;
    render();
    return;
  }
  cat.questions = cat.questions.filter(q => q.id !== qId);
  render();
  saveStateToFirebase();
}

function confirmDeleteQuestion(catId, qId){
  const cat = state.categories.find(c => c.id === catId);
  pendingDeleteQid = null;
  if(cat) cat.questions = cat.questions.filter(q => q.id !== qId);
  render();
  saveStateToFirebase();
}

function cancelDeleteQuestion(){
  pendingDeleteQid = null;
  render();
}

function updateText(catId, qId, field, value){
  const cat = state.categories.find(c => c.id === catId);
  const q = cat.questions.find(q => q.id === qId);
  q[field] = value;
  saveStateToFirebase();
}

function addComment(catId, qId){
  const cat = state.categories.find(c => c.id === catId);
  const q = cat.questions.find(q => q.id === qId);
  if(!q.comments) q.comments = [];
  if(!q.commentMarks) q.commentMarks = [];
  if(!q.commentNights) q.commentNights = [];
  if(!q.commentNightsOn) q.commentNightsOn = [];
  q.comments.push('');
  q.commentMarks.push(null);
  q.commentNights.push('');
  q.commentNightsOn.push(false);
  lastFocusCommentQid = qId;
  lastFocusCommentIdx = q.comments.length - 1;
  render();
  saveStateToFirebase();
}

function updateComment(catId, qId, idx, value){
  const cat = state.categories.find(c => c.id === catId);
  const q = cat.questions.find(q => q.id === qId);
  q.comments[idx] = value;
  saveStateToFirebase();
}

function addCommentNight(catId, qId, idx){
  const cat = state.categories.find(c => c.id === catId);
  const q = cat.questions.find(q => q.id === qId);
  if(!q.commentNightsOn) q.commentNightsOn = [];
  if(!q.commentNights) q.commentNights = [];
  q.commentNightsOn[idx] = true;
  lastFocusNightQid = qId;
  lastFocusNightIdx = idx;
  render();
  saveStateToFirebase();
}

function updateCommentNight(catId, qId, idx, value){
  const cat = state.categories.find(c => c.id === catId);
  const q = cat.questions.find(q => q.id === qId);
  if(!q.commentNights) q.commentNights = [];
  q.commentNights[idx] = value;
  saveStateToFirebase();
}

function deleteComment(catId, qId, idx){
  const cat = state.categories.find(c => c.id === catId);
  const q = cat.questions.find(q => q.id === qId);
  q.comments.splice(idx, 1);
  if(q.commentMarks) q.commentMarks.splice(idx, 1);
  if(q.commentNights) q.commentNights.splice(idx, 1);
  if(q.commentNightsOn) q.commentNightsOn.splice(idx, 1);
  render();
  saveStateToFirebase();
}

const MARK_COLORS = ['cyan', 'green', 'pink', 'purple', 'gray', 'yellow', 'red', 'brown'];
let openMarkPopup = null;

function markPopupKey(qId, target, commentIdx){
  return qId + '|' + target + '|' + (commentIdx === null || commentIdx === undefined ? '' : commentIdx);
}

function buildMarkTools(catId, qId, target, activeColor, commentIdx){
  const wrap = document.createElement('span');
  wrap.className = 'mark-tools';

  const key = markPopupKey(qId, target, commentIdx);
  const isOpen = openMarkPopup === key;

  const penBtn = document.createElement('button');
  penBtn.className = 'mark-pen' + (activeColor ? ' mark-pen-active' : '');
  penBtn.innerHTML = '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18.37 2.63 14 7l-1.59-1.59a2 2 0 0 0-2.82 0L8 6l10 10 1.41-1.59a2 2 0 0 0 0-2.82L18 10l4.37-4.37a2.12 2.12 0 1 0-3-3z"></path><path d="M9 8c-2 3-4 3.5-7 4l8 10c2-1 6-5 6-7"></path></svg><span class="mark-pen-bar' + (activeColor ? ' dot-' + activeColor : '') + '"></span>';
  penBtn.title = 'סמן במרקר';
  penBtn.onclick = () => {
    openMarkPopup = isOpen ? null : key;
    render();
  };
  wrap.appendChild(penBtn);

  if(isOpen){
    const palette = document.createElement('span');
    palette.className = 'mark-palette';
    MARK_COLORS.forEach(color => {
      const dot = document.createElement('button');
      dot.className = 'mark-dot dot-' + color + (activeColor === color ? ' active' : '');
      dot.title = color;
      dot.onclick = () => {
        openMarkPopup = null;
        toggleMark(catId, qId, target, color, commentIdx);
      };
      palette.appendChild(dot);
    });
    wrap.appendChild(palette);
  }

  return wrap;
}

function toggleMark(catId, qId, target, color, commentIdx){
  const cat = state.categories.find(c => c.id === catId);
  const q = cat.questions.find(q => q.id === qId);
  if(target === 'text'){
    q.textMark = (q.textMark === color) ? null : color;
  } else if(target === 'comment'){
    if(!q.commentMarks) q.commentMarks = [];
    q.commentMarks[commentIdx] = (q.commentMarks[commentIdx] === color) ? null : color;
  }
  render();
  saveStateToFirebase();
}

        commentDiv.onkeydown = (e) => handleFieldNav(e, q.id, idx, 'primary');
        commentDiv.onblur = () => {
          normalizeEmptyOnBlur(commentDiv);
          updateComment(cat.id, q.id, idx, commentDiv.innerText);
        };
        bodyDiv.appendChild(commentDiv);
        bodyDiv.appendChild(buildMarkTools(cat.id, q.id, 'comment', mark, idx));

        const delCommentBtn = document.createElement('button');
        delCommentBtn.className = 'btn-del-comment';
        delCommentBtn.innerText = '×';
        delCommentBtn.title = 'מחק תגובה';
        delCommentBtn.onclick = () => deleteComment(cat.id, q.id, idx);
        bodyDiv.appendChild(delCommentBtn);

        const nightOn = (q.commentNightsOn && q.commentNightsOn[idx]) || (q.commentNights && q.commentNights[idx]);
        if(nightOn){
          const nightDiv = document.createElement('div');
          nightDiv.className = 'answer';
          nightDiv.contentEditable = true;
          nightDiv.setAttribute('data-placeholder', 'נייט');
          nightDiv.dataset.qid = q.id;
          nightDiv.dataset.col = 'commentNight';
          nightDiv.dataset.idx = idx;
          nightDiv.innerText = (q.commentNights && q.commentNights[idx]) || '';
          nightDiv.oninput = () => updateCommentNight(cat.id, q.id, idx, nightDiv.innerText);
          nightDiv.onkeydown = (e) => handleFieldNav(e, q.id, idx, 'secondary');
          nightDiv.onblur = () => {
            normalizeEmptyOnBlur(nightDiv);
            updateCommentNight(cat.id, q.id, idx, nightDiv.innerText);
          };
          bodyDiv.appendChild(nightDiv);

          if(q.id === lastFocusNightQid && idx === lastFocusNightIdx){
            requestAnimationFrame(() => {
              nightDiv.focus();
              placeCaretAtEnd(nightDiv);
            });
            lastFocusNightQid = null;
            lastFocusNightIdx = null;
          }
        } else {
          const addNightBtn = document.createElement('button');
          addNightBtn.className = 'btn-add-comment';
          addNightBtn.innerText = '+ נייט';
          addNightBtn.title = 'הוסף נייט לתגובה זו';
          addNightBtn.onclick = () => addCommentNight(cat.id, q.id, idx);
          bodyDiv.appendChild(addNightBtn);
        }

        if(q.id === lastFocusCommentQid && idx === lastFocusCommentIdx){
          requestAnimationFrame(() => {
            commentDiv.focus();
            placeCaretAtEnd(commentDiv);
          });
          lastFocusCommentQid = null;
          lastFocusCommentIdx = null;
        }
      });

      const addCommentBtn = document.createElement('button');
      addCommentBtn.className = 'btn-add-comment';
      addCommentBtn.innerText = '+ תגובה';
      addCommentBtn.title = 'הוסף תגובה נוספת';
      addCommentBtn.onclick = () => addComment(cat.id, q.id);
      bodyDiv.appendChild(addCommentBtn);

      const doneBtn = document.createElement('button');
      doneBtn.className = 'btn-done';
      doneBtn.innerText = q.done ? '↩ בטל טופל' : '✔ טופל';
      doneBtn.onclick = () => toggleDone(cat.id, q.id);
      bodyDiv.appendChild(doneBtn);

      qDiv.appendChild(bodyDiv);

      if(pendingDeleteQid === q.id){
        const confirmWrap = document.createElement('span');
        confirmWrap.className = 'del-confirm-inline';

        const msg = document.createElement('span');
        msg.innerText = 'לא סומנה כטופלה - למחוק בכל זאת?';
        confirmWrap.appendChild(msg);

        const yesBtn = document.createElement('button');
        yesBtn.innerText = 'כן';
        yesBtn.onclick = () => confirmDeleteQuestion(cat.id, q.id);
        confirmWrap.appendChild(yesBtn);

        const noBtn = document.createElement('button');
        noBtn.innerText = 'לא';
        noBtn.onclick = cancelDeleteQuestion;
        confirmWrap.appendChild(noBtn);

        qDiv.appendChild(confirmWrap);
      } else {
        const delBtn = document.createElement('button');
        delBtn.className = 'btn-del';
        delBtn.innerText = '🗑';
        delBtn.title = 'מחק שאלה';
        delBtn.onclick = () => deleteQuestion(cat.id, q.id);
        delBtn.onmouseenter = () => qDiv.classList.add('row-del-hover');
        delBtn.onmouseleave = () => qDiv.classList.remove('row-del-hover');
        qDiv.appendChild(delBtn);
      }

      catDiv.appendChild(qDiv);
    });

    flatNav.push({qid: null, idx: 'add', catId: cat.id});

    // add question row
    const addRow = document.createElement('div');
    addRow.className = 'add-row';
    const addInput = document.createElement('div');
    addInput.className = 'qtext new-question-input';
    addInput.contentEditable = true;
    addInput.id = 'add-input-' + cat.id;
    addInput.setAttribute('data-placeholder', cat.mode === 'night' ? 'נייט חדש... (Enter להוספה מהירה)' : 'שאלה חדשה... (Enter להוספה מהירה, אפשר גם להדביק תמונה)');
    addInput.onkeydown = (e) => {
      if(e.key === 'Enter'){
        e.preventDefault();
        lastFocusCatId = cat.id;
        addQuestion(cat.id, addInput.innerHTML);
      } else if(e.key === 'ArrowDown'){
        e.preventDefault();
        insertLineBreakAtCaret();
      } else if(e.key === 'ArrowUp'){
        if(isCaretOnFirstLine(addInput)){
          handleAddInputNav(e, cat.id);
        }
      }
    };
    attachImagePaste(addInput);

    const addBtn = document.createElement('button');
    addBtn.innerText = '+';
    addBtn.title = 'הוסף שאלה';
    addBtn.onclick = () => addQuestion(cat.id, addInput.innerHTML);

    addRow.appendChild(addInput);
    addRow.appendChild(addBtn);
    catDiv.appendChild(addRow);

    board.appendChild(catDiv);
  });

  const addCatBottom = document.createElement('div');
  addCatBottom.className = 'add-category-row';
  addCatBottom.style.marginTop = '10px';

  const bottomInput = document.createElement('input');
  bottomInput.type = 'text';
  bottomInput.id = 'new-cat-input-bottom';
  bottomInput.placeholder = 'שם קטגוריה חדשה, למשל: קוליות';
  bottomInput.onkeydown = (e) => {
    if(e.key === 'Enter'){
      e.preventDefault();
      addCategory('new-cat-input-bottom');
    }
  };
  addCatBottom.appendChild(bottomInput);

  const bottomBtn = document.createElement('button');
  bottomBtn.innerText = '+';
  bottomBtn.title = 'הוסף קטגוריה חדשה';
  bottomBtn.onclick = () => addCategory('new-cat-input-bottom');
  addCatBottom.appendChild(bottomBtn);

  board.appendChild(addCatBottom);

  if(lastFocusCatId){
    const catIdToFocus = lastFocusCatId;
    const inputToFocus = document.getElementById('add-input-' + catIdToFocus);
    if(inputToFocus) inputToFocus.focus();
    lastFocusCatId = null;
    // רשת ביטחון: אם משהו אסינכרוני (למשל הד מ-Firebase) גוזל את הפוקוס רגע אחרי,
    // ננסה להחזיר אותו לאותה תיבה כמה פעמים בפרקי זמן קצרים
    [30, 100, 300].forEach(delay => {
      setTimeout(() => {
        const el = document.getElementById('add-input-' + catIdToFocus);
        if(el && document.activeElement !== el && document.activeElement === document.body){
          el.focus();
        }
      }, delay);
    });
  }

  if(lastFocusNewQid){
    const qidToFocus = lastFocusNewQid;
    focusFieldEnd(qidToFocus, 'text');
    lastFocusNewQid = null;
    [30, 100, 300].forEach(delay => {
      setTimeout(() => {
        const el = document.querySelector('[data-qid="' + qidToFocus + '"][data-col="text"]');
        if(el && document.activeElement !== el && document.activeElement === document.body){
          el.focus();
          placeCaretAtEnd(el);
        }
      }, delay);
    });
  }
}

document.addEventListener('click', (e) => {
  if(openMarkPopup && !e.target.closest('.mark-tools')){
    openMarkPopup = null;
    render();
  }
});

render();
</script>

</body>
</html>
