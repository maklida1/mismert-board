          deleteQuestionIfEmpty(cat.id, q.id);
        };
        bodyDiv.appendChild(answerDiv);
      }

      (q.comments || []).forEach((commentText, idx) => {
        flatNav.push({qid: q.id, idx});
        const mark = (q.commentMarks && q.commentMarks[idx]) || null;
        const rowHasNight = !!((q.commentNightsOn && q.commentNightsOn[idx]) || (q.commentNights && q.commentNights[idx]));
        const rowHasExtra = !!(q.commentExtra && q.commentExtra[idx] && q.commentExtra[idx].length > 0);
        const rowHasMore = rowHasNight || rowHasExtra;
        const commentHasContent = commentText && commentText.trim() !== '';
        const extraItems = (q.commentExtra && q.commentExtra[idx]) || [];
        let lastTypistExtraIdx = -1;
        extraItems.forEach((item, subIdx) => { if(item.type !== 'night') lastTypistExtraIdx = subIdx; });

        // תא המקלידה הראשון מוצג רק אם יש בו תוכן, או שאין שום דבר אחר בשרשור (כדי שתמיד יהיה תא לכתוב בו).
        // אם התוכן שלו נמחק אבל יש נייט/תגובות המשך - התא נעלם ורק הם נשארים.
        if(commentHasContent || !rowHasMore){
          const commentDiv = document.createElement('div');
          commentDiv.className = 'comment' + (mark ? (' mark-' + mark) : '');
          commentDiv.contentEditable = true;
          commentDiv.setAttribute('data-placeholder', 'מקליד/ה...');
          commentDiv.dataset.qid = q.id;
          commentDiv.dataset.col = 'comment';
          commentDiv.dataset.idx = idx;
          commentDiv.innerText = commentText;
          let commentHandledDelete = false;
          commentDiv.oninput = () => {
            if(commentHandledDelete) return;
            const empty = commentDiv.textContent.trim() === '' && !commentDiv.querySelector('img');
            if(empty && !rowHasMore){
              commentHandledDelete = true;
              deleteComment(cat.id, q.id, idx);
            } else if(empty && rowHasMore){
              commentHandledDelete = true;
              q.comments[idx] = '';
              saveStateToFirebase();
              render();
            } else {
              updateComment(cat.id, q.id, idx, commentDiv.innerText);
            }
          };
          commentDiv.onkeydown = (e) => handleFieldNav(e, q.id, idx, 'primary');
          commentDiv.onblur = () => {
            if(commentHandledDelete) return;
            normalizeEmptyOnBlur(commentDiv);
            const empty = commentDiv.textContent.trim() === '' && !commentDiv.querySelector('img');
            if(empty && !rowHasMore){
              commentHandledDelete = true;
              deleteComment(cat.id, q.id, idx);
            } else if(empty && rowHasMore){
              commentHandledDelete = true;
              q.comments[idx] = '';
              saveStateToFirebase();
              render();
            } else {
              updateComment(cat.id, q.id, idx, commentDiv.innerText);
            }
          };
          bodyDiv.appendChild(commentDiv);

          if(q.id === lastFocusCommentQid && idx === lastFocusCommentIdx){
            requestAnimationFrame(() => {
              commentDiv.focus();
              placeCaretAtEnd(commentDiv);
            });
            lastFocusCommentQid = null;
            lastFocusCommentIdx = null;
          }
        }

        const nightOn = rowHasNight;
        if(nightOn){
          const nightDiv = document.createElement('div');
          nightDiv.className = 'answer';
          nightDiv.contentEditable = true;
          nightDiv.setAttribute('data-placeholder', 'נייט');
          nightDiv.dataset.qid = q.id;
          nightDiv.dataset.col = 'commentNight';
          nightDiv.dataset.idx = idx;
          nightDiv.innerText = (q.commentNights && q.commentNights[idx]) || '';
          let nightHandledDelete = false;
          nightDiv.oninput = () => {
            if(nightHandledDelete) return;
            if(nightDiv.textContent.trim() === '' && !nightDiv.querySelector('img')){
              nightHandledDelete = true;
              deleteCommentNight(cat.id, q.id, idx);
            } else {
              updateCommentNight(cat.id, q.id, idx, nightDiv.innerText);
            }
          };
          nightDiv.onkeydown = (e) => handleFieldNav(e, q.id, idx, 'secondary');
          nightDiv.onblur = () => {
            if(nightHandledDelete) return;
            normalizeEmptyOnBlur(nightDiv);
            if(nightDiv.textContent.trim() === '' && !nightDiv.querySelector('img')){
              nightHandledDelete = true;
              deleteCommentNight(cat.id, q.id, idx);
            } else {
              updateCommentNight(cat.id, q.id, idx, nightDiv.innerText);
            }
          };
          bodyDiv.appendChild(nightDiv);

          if(q.id === lastFocusNightQid && idx === lastFocusNightIdx){
            requestAnimationFrame(() => {
              nightDiv.focus();
              placeCaretAtEnd(nightDiv);
            });
            lastFocusNightQid = null;
            lastFocusNightIdx = null;
          }
        }

        // המשך השרשור לתגובה הזו - פריטים נוספים (נייט/מקליד/ה) שנוספו אחרי הנייט הראשון
        extraItems.forEach((item, subIdx) => {
          const itemDiv = document.createElement('div');
          itemDiv.className = item.type === 'night' ? 'answer' : ('comment' + (item.mark ? (' mark-' + item.mark) : ''));
          itemDiv.contentEditable = true;
          itemDiv.setAttribute('data-placeholder', item.type === 'night' ? 'נייט' : 'מקליד/ה...');
          itemDiv.setAttribute('data-qid', q.id);
          itemDiv.setAttribute('data-col', 'extra');
          itemDiv.setAttribute('data-idx', idx);
          itemDiv.setAttribute('data-subidx', subIdx);
          itemDiv.innerText = item.text || '';
          itemDiv.onkeydown = (e) => handleExtraNav(e, q.id, idx, subIdx, extraItems.length);
          let extraHandledDelete = false;
          itemDiv.oninput = () => {
            if(extraHandledDelete) return;
            if(itemDiv.textContent.trim() === '' && !itemDiv.querySelector('img')){
              extraHandledDelete = true;
              deleteCommentExtra(cat.id, q.id, idx, subIdx);
            } else {
              updateCommentExtra(cat.id, q.id, idx, subIdx, itemDiv.innerText);
            }
          };
          itemDiv.onblur = () => {
            if(extraHandledDelete) return;
            normalizeEmptyOnBlur(itemDiv);
            if(itemDiv.textContent.trim() === '' && !itemDiv.querySelector('img')){
              extraHandledDelete = true;
              deleteCommentExtra(cat.id, q.id, idx, subIdx);
            } else {
              updateCommentExtra(cat.id, q.id, idx, subIdx, itemDiv.innerText);
            }
          };
          bodyDiv.appendChild(itemDiv);

          if(q.id === lastFocusExtraQid && idx === lastFocusExtraIdx && subIdx === lastFocusExtraSub){
            requestAnimationFrame(() => {
              itemDiv.focus();
              placeCaretAtEnd(itemDiv);
            });
            lastFocusExtraQid = null;
            lastFocusExtraIdx = null;
            lastFocusExtraSub = null;
          }
        });

        // כפתור "+" להמשך השרשור - תמיד מיד אחרי הפריט האחרון בשרשור, כך שכל פריט חדש שנוסף "מקדם" אותו למקומו החדש בסוף
        const isLastRow = idx === (q.comments.length - 1);
        if(isLastRow){
        const rowKey = rowAddPopupKey(q.id, idx);
        const isRowPopupOpen = openRowAddPopup === rowKey;
        const rowAddWrap = document.createElement('span');
        rowAddWrap.style.display = 'inline-flex';
        rowAddWrap.style.alignItems = 'center';
        rowAddWrap.style.position = 'relative';

        const rowAddBtn = document.createElement('button');
        rowAddBtn.className = 'btn-add-comment';
        rowAddBtn.innerText = '+';
        rowAddBtn.title = 'הוסף נייט או מקליד/ה לשרשור זה';
        rowAddBtn.onclick = () => {
          openRowAddPopup = isRowPopupOpen ? null : rowKey;
          render();
        };
        rowAddWrap.appendChild(rowAddBtn);

        if(isRowPopupOpen){
          const rowPopup = document.createElement('span');
          rowPopup.className = 'add-comment-popup';

          const rowTypistOpt = document.createElement('button');
          rowTypistOpt.innerText = 'מקליד/ה';
          rowTypistOpt.onclick = () => {
            openRowAddPopup = null;
            addRowThreadItem(cat.id, q.id, idx, 'typist');
          };
          rowPopup.appendChild(rowTypistOpt);

          const rowNightOpt = document.createElement('button');
          rowNightOpt.innerText = 'נייט';
          rowNightOpt.onclick = () => {
            openRowAddPopup = null;
            addRowThreadItem(cat.id, q.id, idx, 'night');
          };
          rowPopup.appendChild(rowNightOpt);

          const rowMarkRow = document.createElement('div');
          rowMarkRow.className = 'add-comment-popup-mark-row';
          if(lastTypistExtraIdx !== -1){
            const lastExtraMark = extraItems[lastTypistExtraIdx].mark || null;
            rowMarkRow.appendChild(buildMarkTools(cat.id, q.id, 'extra', lastExtraMark, idx, lastTypistExtraIdx));
          } else {
            rowMarkRow.appendChild(buildMarkTools(cat.id, q.id, 'comment', mark, idx));
          }
          rowPopup.appendChild(rowMarkRow);

          rowAddWrap.appendChild(rowPopup);
        }

        bodyDiv.appendChild(rowAddWrap);
        }
      });

      // כפתור "+" הכללי - מוצג רק כשאין עדיין אף תגובה, כדי להתחיל את השרשור הראשון.
      // ברגע שיש תגובה אחת לפחות, ה"+" היחיד שקיים הוא זה שאחרי הפריט האחרון בשרשור (למעלה).
      if((q.comments || []).length === 0){
      const addCommentWrap = document.createElement('span');
      addCommentWrap.style.display = 'inline-flex';
      addCommentWrap.style.alignItems = 'center';
      addCommentWrap.style.position = 'relative';

      const addCommentBtn = document.createElement('button');
      addCommentBtn.className = 'btn-add-comment';
      addCommentBtn.innerText = '+';
      addCommentBtn.title = 'הוסף מקליד/ה או נייט';
      const isAddCommentPopupOpen = openAddCommentPopup === q.id;
      addCommentBtn.onclick = () => {
        openAddCommentPopup = isAddCommentPopupOpen ? null : q.id;
        render();
      };
      addCommentWrap.appendChild(addCommentBtn);

      if(isAddCommentPopupOpen){
        const popup = document.createElement('span');
        popup.className = 'add-comment-popup';

        const addTypistOpt = document.createElement('button');
        addTypistOpt.innerText = 'מקליד/ה';
        addTypistOpt.onclick = () => {
          openAddCommentPopup = null;
          addComment(cat.id, q.id, false);
        };
        popup.appendChild(addTypistOpt);

        const addNightOpt = document.createElement('button');
        addNightOpt.innerText = 'נייט';
        addNightOpt.onclick = () => {
          openAddCommentPopup = null;
          addComment(cat.id, q.id, true);
        };
        popup.appendChild(addNightOpt);

        addCommentWrap.appendChild(popup);
      }

      bodyDiv.appendChild(addCommentWrap);
      }

      const doneBtn = document.createElement('button');
      doneBtn.className = 'btn-done-mini';
      doneBtn.innerText = q.done ? '↩' : '✔';
      doneBtn.title = q.done ? 'בטל טופל' : 'טופל';
      doneBtn.onclick = () => toggleDone(cat.id, q.id);
      bodyDiv.appendChild(doneBtn);

      qDiv.appendChild(bodyDiv);

      if(pendingDeleteQid === q.id){
        const confirmWrap = document.createElement('span');
        confirmWrap.className = 'del-confirm-inline';

        const msg = document.createElement('span');
        msg.innerText = 'לא סומנה כטופלה - למחוק בכל זאת?';
        confirmWrap.appendChild(msg);

        const yesBtn = document.createElement('button');
        yesBtn.innerText = 'כן';
        yesBtn.onclick = () => confirmDeleteQuestion(cat.id, q.id);
        confirmWrap.appendChild(yesBtn);

        const noBtn = document.createElement('button');
        noBtn.innerText = 'לא';
        noBtn.onclick = cancelDeleteQuestion;
        confirmWrap.appendChild(noBtn);

        qDiv.appendChild(confirmWrap);
      } else {
        const delBtn = document.createElement('button');
        delBtn.className = 'btn-del';
        delBtn.innerText = '🗑';
        delBtn.title = 'מחק שאלה';
        delBtn.onclick = () => deleteQuestion(cat.id, q.id);
        delBtn.onmouseenter = () => qDiv.classList.add('row-del-hover');
        delBtn.onmouseleave = () => qDiv.classList.remove('row-del-hover');
        qDiv.appendChild(delBtn);
      }

      catDiv.appendChild(qDiv);
    });

    flatNav.push({qid: null, idx: 'add', catId: cat.id});

    // add question row
    const addRow = document.createElement('div');
    addRow.className = 'add-row';
    const addInput = document.createElement('div');
    addInput.className = 'qtext new-question-input';
    addInput.contentEditable = true;
    addInput.setAttribute('contenteditable', 'true');
    addInput.id = 'add-input-' + cat.id;
    addInput.setAttribute('data-placeholder', cat.mode === 'night' ? 'נייט חדש... (Enter להוספה מהירה)' : 'שאלה חדשה... (Enter להוספה מהירה, אפשר גם להדביק תמונה)');
    addInput.onkeydown = (e) => {
      if(e.key === 'Enter'){
        e.preventDefault();
        lastFocusCatId = cat.id;
        addQuestion(cat.id, addInput.innerHTML);
      } else if(e.key === 'ArrowDown'){
        e.preventDefault();
        insertLineBreakAtCaret();
      } else if(e.key === 'ArrowUp'){
        if(isCaretOnFirstLine(addInput)){
          handleAddInputNav(e, cat.id);
        }
      }
    };
    attachImagePaste(addInput);

    const addBtn = document.createElement('button');
    addBtn.innerText = '+';
    addBtn.title = 'הוסף שאלה';
    addBtn.onclick = () => addQuestion(cat.id, addInput.innerHTML);

    addRow.appendChild(addInput);
    addRow.appendChild(addBtn);
    catDiv.appendChild(addRow);

    board.appendChild(catDiv);
  });

  const addCatBottom = document.createElement('div');
  addCatBottom.className = 'add-category-row';
  addCatBottom.style.marginTop = '10px';

  const bottomInput = document.createElement('input');
  bottomInput.type = 'text';
  bottomInput.id = 'new-cat-input-bottom';
  bottomInput.placeholder = 'שם קטגוריה חדשה, למשל: קוליות';
  bottomInput.onkeydown = (e) => {
    if(e.key === 'Enter'){
      e.preventDefault();
      addCategory('new-cat-input-bottom');
    }
  };
  addCatBottom.appendChild(bottomInput);

  const bottomBtn = document.createElement('button');
  bottomBtn.innerText = '+';
  bottomBtn.title = 'הוסף קטגוריה חדשה';
  bottomBtn.onclick = () => addCategory('new-cat-input-bottom');
  addCatBottom.appendChild(bottomBtn);

  board.appendChild(addCatBottom);

  if(lastFocusCatId){
    const catIdToFocus = lastFocusCatId;
    const inputToFocus = document.getElementById('add-input-' + catIdToFocus);
    if(inputToFocus) inputToFocus.focus();
    lastFocusCatId = null;
    // רשת ביטחון: אם משהו אסינכרוני (למשל הד מ-Firebase) גוזל את הפוקוס רגע אחרי,
    // ננסה להחזיר אותו לאותה תיבה כמה פעמים בפרקי זמן קצרים
    [30, 100, 300].forEach(delay => {
      setTimeout(() => {
        const el = document.getElementById('add-input-' + catIdToFocus);
        if(el && document.activeElement !== el && document.activeElement === document.body){
          el.focus();
        }
      }, delay);
    });
  }

  if(lastFocusNewQid){
    const qidToFocus = lastFocusNewQid;
    focusFieldEnd(qidToFocus, 'text');
    lastFocusNewQid = null;
    [30, 100, 300].forEach(delay => {
      setTimeout(() => {
        const el = document.querySelector('[data-qid="' + qidToFocus + '"][data-col="text"]');
        if(el && document.activeElement !== el && document.activeElement === document.body){
          el.focus();
          placeCaretAtEnd(el);
        }
      }, delay);
    });
  }
}

// מפורמט מפתח תאריך (YYYY-MM-DD) לתצוגה בעברית, כמו שורת התאריך הראשית
function formatDateKeyDisplay(dateKey){
  const parts = dateKey.split('-');
  if(parts.length !== 3) return dateKey;
  const days = ['יום ראשון', 'יום שני', 'יום שלישי', 'יום רביעי', 'יום חמישי', 'יום שישי', 'יום שבת'];
  const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
  return days[d.getDay()] + ' ' + d.getDate() + '/' + (d.getMonth() + 1) + '/' + d.getFullYear();
}

function toggleHistoryView(){
  currentView = (currentView === 'history') ? 'board' : 'history';
  if(currentView === 'history') historySelectedDateKey = null;
  render();
}

// בונה בלוק שאלה לתצוגה בלבד (היסטוריה) - בלי עריכה ובלי קו חוצה של "טופל",
// גם אם השאלה הייתה מסומנת כטופלה לפני שנמחקה. אם מועבר restoreInfo, מוצג גם כפתור שחזור.
function buildReadOnlyQuestionBlock(q, isNightCat, numberLabel, restoreInfo){
  const qDiv = document.createElement('div');
  qDiv.className = 'question-block readonly' + (q.sub ? ' sub' : '');

  const numDiv = document.createElement('div');
  numDiv.className = 'qnum';
  numDiv.innerText = numberLabel;
  qDiv.appendChild(numDiv);

  const bodyDiv = document.createElement('div');
  bodyDiv.className = 'qbody';

  const textDiv = document.createElement('div');
  textDiv.className = isNightCat ? 'answer' : ('qtext' + (q.textMark ? (' mark-' + q.textMark) : ''));
  textDiv.innerHTML = q.text || '';
  appendAttr(textDiv, q.createdBy, q.createdAt);
  bodyDiv.appendChild(textDiv);

  if(!isNightCat && q.answer && q.answer.trim() !== ''){
    const answerDiv = document.createElement('div');
    answerDiv.className = 'answer';
    answerDiv.innerText = q.answer;
    appendAttr(answerDiv, q.answerBy, q.answerAt);
    bodyDiv.appendChild(answerDiv);
  }

  (q.comments || []).forEach((commentText, idx) => {
    const mark = (q.commentMarks && q.commentMarks[idx]) || null;
    if(commentText && commentText.trim() !== ''){
      const commentDiv = document.createElement('div');
      commentDiv.className = 'comment' + (mark ? (' mark-' + mark) : '');
      commentDiv.innerText = commentText;
      appendAttr(commentDiv, q.commentBy && q.commentBy[idx], q.commentAt && q.commentAt[idx]);
      bodyDiv.appendChild(commentDiv);
    }
    const nightText = q.commentNights && q.commentNights[idx];
    if(nightText && nightText.trim() !== ''){
      const nightDiv = document.createElement('div');
      nightDiv.className = 'answer';
      nightDiv.innerText = nightText;
      appendAttr(nightDiv, q.commentNightsBy && q.commentNightsBy[idx], q.commentNightsAt && q.commentNightsAt[idx]);
      bodyDiv.appendChild(nightDiv);
    }
    const extraItems = (q.commentExtra && q.commentExtra[idx]) || [];
    extraItems.forEach(item => {
      if(!item || !item.text || item.text.trim() === '') return;
      const itemDiv = document.createElement('div');
      itemDiv.className = item.type === 'night' ? 'answer' : ('comment' + (item.mark ? (' mark-' + item.mark) : ''));
      itemDiv.innerText = item.text;
      appendAttr(itemDiv, item.by, item.at);
      bodyDiv.appendChild(itemDiv);
    });
  });

  if(q.done){
    const doneDiv = document.createElement('div');
    doneDiv.className = 'comment';
    doneDiv.innerText = 'טופל';
    appendAttr(doneDiv, q.doneBy, q.doneAt);
    bodyDiv.appendChild(doneDiv);
  }

  if(q.deletedBy || q.deletedAt){
    const delDiv = document.createElement('div');
    delDiv.className = 'comment';
    delDiv.innerText = 'נמחק';
    appendAttr(delDiv, q.deletedBy, q.deletedAt);
    bodyDiv.appendChild(delDiv);
  }

  qDiv.appendChild(bodyDiv);

  if(restoreInfo){
    const restoreBtn = document.createElement('button');
    restoreBtn.className = 'history-restore-btn';
    restoreBtn.innerText = '↩ שחזור';
    restoreBtn.title = 'שחזור לשאלה פעילה';
    restoreBtn.onclick = () => {
      restoreQuestionFromHistory(restoreInfo.dateKey, restoreInfo.catId, restoreInfo.pushKey, q);
    };
    restoreBtn.onmouseenter = () => qDiv.classList.add('row-del-hover');
    restoreBtn.onmouseleave = () => qDiv.classList.remove('row-del-hover');
    qDiv.appendChild(restoreBtn);
  }

  return qDiv;
}

// מחזיר שאלה מההיסטוריה בחזרה לקטגוריה הפעילה בלוח, ומסיר אותה מההיסטוריה
function restoreQuestionFromHistory(dateKey, catId, pushKey, q){
  const cat = state.categories.find(c => c.id === catId);
  if(!cat){
    alert('לא ניתן לשחזר - הקטגוריה המקורית כבר לא קיימת בלוח.');
    return;
  }

  const restored = Object.assign({}, q, { id: uid('q'), deletedBy: null });
  cat.questions.push(restored);

  // מסירים מההיסטוריה גם ב-Firebase וגם מקומית, כדי שהתצוגה תתעדכן מיד
  if(database){
    database.ref('historyState/' + dateKey + '/' + catId + '/questions/' + pushKey).remove().catch((err) => {
      console.error('Firebase HISTORY REMOVE (after restore) failed:', err);
    });
  }
  if(historyData[dateKey] && historyData[dateKey][catId] && historyData[dateKey][catId].questions){
    delete historyData[dateKey][catId].questions[pushKey];
  }

  currentView = 'board';
  render();
  saveStateToFirebase();
}

function renderHistory(){
  const board = document.getElementById('board');
  board.innerHTML = '';

  if(historyLoadError){
    const errBox = document.createElement('div');
    errBox.className = 'history-error';
    errBox.innerHTML = '<b>לא ניתן לטעון את ההיסטוריה</b>' +
      'שגיאה מ-Firebase: <code>' + historyLoadError + '</code><br>' +
      'סביר להניח שכללי ההרשאות (Rules) במסד הנתונים מגבילים גישה לנתיב <code>historyState</code>. ' +
      'יש לוודא בהגדרות ה-Realtime Database שהנתיב הזה מאושר לקריאה וכתיבה, לא רק boardState.';
    board.appendChild(errBox);
    return;
  }

  // מהחדש לישן - רק תאריכים שיש בהם בפועל נתונים בהיסטוריה
  const dateKeys = Object.keys(historyData || {}).sort((a, b) => b.localeCompare(a));

  if(dateKeys.length === 0 && !historySelectedDateKey){
    const empty = document.createElement('div');
    empty.className = 'history-empty';
    empty.innerText = 'עדיין אין שאלות בהיסטוריה.';
    board.appendChild(empty);
    return;
  }

  // אם לא נבחר תאריך באופן ידני - ברירת המחדל היא התאריך העדכני ביותר שיש בו נתונים
  if(!historySelectedDateKey){
    historySelectedDateKey = dateKeys[0] || getTodayDateKey();
  }
  const dateKey = historySelectedDateKey;
  const hasData = dateKeys.indexOf(dateKey) !== -1;

  // מוצא את התאריך העדכני/הישן ביותר מבין התאריכים שיש בהם נתונים, יחסית לתאריך המוצג -
  // כדי שהחצים ידעו לאן לנווט גם אם התאריך הנוכחי נבחר ידנית ואין בו נתונים
  const asc = [...dateKeys].sort((a, b) => a.localeCompare(b));
  let newerTarget = null; // תאריך חדש יותר (עם נתונים)
  for(let i = 0; i < asc.length; i++){
    if(asc[i] > dateKey){ newerTarget = asc[i]; break; }
  }
  let olderTarget = null; // תאריך ישן יותר (עם נתונים)
  for(let i = asc.length - 1; i >= 0; i--){
    if(asc[i] < dateKey){ olderTarget = asc[i]; break; }
  }

  // סרגל ניווט בין תאריכים: הבא/קודם + בחירת תאריך מלוח שנה
  const nav = document.createElement('div');
  nav.className = 'history-nav';

  const newerBtn = document.createElement('button');
  newerBtn.className = 'history-nav-btn';
  newerBtn.innerText = '▶';
  newerBtn.title = 'תאריך חדש יותר';
  newerBtn.disabled = !newerTarget;
  newerBtn.onclick = () => {
    if(newerTarget){ historySelectedDateKey = newerTarget; render(); }
  };
  nav.appendChild(newerBtn);

  // תאריך לחיץ שפותח בחירת תאריך מלוח שנה (input מסוג date, מוסתר מבחינה ויזואלית)
  const dateLabelWrap = document.createElement('div');
  dateLabelWrap.className = 'history-date-picker-wrap';

  const dateLabel = document.createElement('button');
  dateLabel.type = 'button';
  dateLabel.className = 'history-date-label';
  dateLabel.innerText = formatDateKeyDisplay(dateKey);
  dateLabel.title = 'לחיצה לבחירת תאריך מלוח שנה';

  const dateInput = document.createElement('input');
  dateInput.type = 'date';
  dateInput.className = 'history-date-input';
  dateInput.value = dateKey;
  dateInput.onchange = () => {
    if(dateInput.value){
      historySelectedDateKey = dateInput.value;
      render();
    }
  };
  dateLabel.onclick = () => {
    if(typeof dateInput.showPicker === 'function'){
      dateInput.showPicker();
    } else {
      dateInput.focus();
      dateInput.click();
    }
  };

  dateLabelWrap.appendChild(dateLabel);
  dateLabelWrap.appendChild(dateInput);
  nav.appendChild(dateLabelWrap);

  const olderBtn = document.createElement('button');
  olderBtn.className = 'history-nav-btn';
  olderBtn.innerText = '◀';
  olderBtn.title = 'תאריך ישן יותר';
  olderBtn.disabled = !olderTarget;
  olderBtn.onclick = () => {
    if(olderTarget){ historySelectedDateKey = olderTarget; render(); }
  };
  nav.appendChild(olderBtn);

  let delDateBtn = null;
  if(isAdmin() && hasData){
    delDateBtn = document.createElement('button');
    delDateBtn.className = 'history-del-date-btn history-del-date-btn-corner';
    delDateBtn.innerText = '🗑 מחיקת תאריך';
    delDateBtn.title = 'מחיקת כל ההיסטוריה של התאריך המוצג';
    delDateBtn.onclick = () => {
      if(confirm('למחוק לגמרי את כל ההיסטוריה של תאריך ' + formatDateKeyDisplay(dateKey) + '? הפעולה בלתי הפיכה.')){
        if(database){
          database.ref('historyState/' + dateKey).remove().catch((err) => {
            console.error('Firebase history date delete failed:', err);
            alert('מחיקת התאריך נכשלה.');
          });
        }
      }
    };
    board.appendChild(nav);
    board.appendChild(delDateBtn);
  } else {
    board.appendChild(nav);
  }

  // אם אין נתונים בכלל לתאריך שנבחר - מציגים הודעה מתאימה ולא ממשיכים
  if(!hasData){
    const dateBlock = document.createElement('div');
    dateBlock.className = 'history-date-block';

    const empty = document.createElement('div');
    empty.className = 'history-empty';
    empty.innerText = 'אין נתונים בתאריך זה.';
    dateBlock.appendChild(empty);

    board.appendChild(dateBlock);
    return;
  }

  // תוכן התאריך הנבחר
  const catsForDate = historyData[dateKey] || {};
  // מסדרים את הקטגוריות לפי הסדר הנוכחי שלהן בדף השאלות; קטגוריות שנמחקו מהדף הראשי
  // (ולכן לא מופיעות ב-state.categories) מוצגות אחרי כל השאר, בסדר יציב.
  const catOrderMap = {};
  state.categories.forEach((c, i) => { catOrderMap[c.id] = i; });
  const catIds = Object.keys(catsForDate).sort((a, b) => {
    const ao = Object.prototype.hasOwnProperty.call(catOrderMap, a) ? catOrderMap[a] : Infinity;
    const bo = Object.prototype.hasOwnProperty.call(catOrderMap, b) ? catOrderMap[b] : Infinity;
    if(ao !== bo) return ao - bo;
    return a.localeCompare(b);
  });

  const dateBlock = document.createElement('div');
  dateBlock.className = 'history-date-block';

  let hasAnyQuestionForDate = false;

  catIds.forEach(catId => {
    const catEntry = catsForDate[catId];
    if(!catEntry || !catEntry.questions) return;
    const questionsObj = catEntry.questions;
    const qList = Object.keys(questionsObj)
      .map(k => ({ key: k, q: questionsObj[k] }))
      .filter(item => item.q)
      .sort((a, b) => (a.key < b.key ? -1 : (a.key > b.key ? 1 : 0)));
    if(qList.length === 0) return;
    hasAnyQuestionForDate = true;

    const catDiv = document.createElement('div');
    catDiv.className = 'category';

    const header = document.createElement('div');
    header.className = 'category-header';
    const titleEl = document.createElement('div');
    titleEl.className = 'category-title';
    titleEl.innerText = catEntry.title || '';
    header.appendChild(titleEl);
    catDiv.appendChild(header);

    const isNightCat = (catId === 'cat-night');
    let mainCounter = 0;
    qList.forEach(item => {
      const q = item.q;
      if(!q.sub) mainCounter++;
      const label = q.sub ? '+' : (mainCounter + '.');
      const restoreInfo = { dateKey: dateKey, catId: catId, pushKey: item.key };
      catDiv.appendChild(buildReadOnlyQuestionBlock(q, isNightCat, label, restoreInfo));
    });

    dateBlock.appendChild(catDiv);
  });

  if(!hasAnyQuestionForDate){
    const empty = document.createElement('div');
    empty.className = 'history-empty';
    empty.innerText = 'אין שאלות בתאריך זה.';
    dateBlock.appendChild(empty);
  }

  board.appendChild(dateBlock);

  // ממקם את כפתור מחיקת התאריך צמוד לקצה השמאלי של המסך, בגובה החלק העליון
  // של הקטגוריה הראשונה (קוליות) - כדי שיהיה ברור למה הוא שייך
  if(delDateBtn){
    requestAnimationFrame(() => {
      const firstCat = dateBlock.querySelector('.category');
      const r = (firstCat || dateBlock).getBoundingClientRect();
      delDateBtn.style.top = Math.round(r.top) + 'px';
    });
  }
}

// שומר את רשימת המשתמשים המעודכנת ב-Firebase, כך שהיא מסתנכרת לכל המכשירים
function saveUsersToFirebase(){
  if(!database) return;
  database.ref('usersState').set(usersData).catch((err) => {
    console.error('Firebase USERS SAVE failed (check your database Rules for write access):', err);
  });
}

// שומר את רשימת הרשאות המנהל המעודכנת ב-Firebase, כך שהיא מסתנכרת לכל המכשירים
function saveAdminsToFirebase(){
  if(!database) return;
  database.ref('adminUsersState').set(adminUsersData).catch((err) => {
    console.error('Firebase ADMINS SAVE failed (check your database Rules for write access):', err);
  });
}

// דף "ניהול משתמשים" - זמין רק למנהל (Yuval). מציג את רשימת המשתמשים, מאפשר לערוך
// סיסמה, למחוק משתמש (חוץ מהמנהל עצמו, כדי לא לחסום גישה בטעות) ולהוסיף משתמש חדש.
function toggleUsersView(){
  if(!isAdmin()) return; // הגנה נוספת בצד לקוח - הכפתור ממילא מוסתר למי שאינו מנהל
  currentView = (currentView === 'users') ? 'board' : 'users';
  render();
}

function renderUsersPage(){
  const board = document.getElementById('board');
  board.innerHTML = '';

  if(!isAdmin()){
    const denied = document.createElement('div');
    denied.className = 'history-error';
    denied.innerHTML = '<b>אין הרשאה</b>העמוד הזה זמין רק למנהל המערכת.';
    board.appendChild(denied);
    return;
  }

  if(usersLoadError){
    const errBox = document.createElement('div');
    errBox.className = 'history-error';
    errBox.innerHTML = '<b>לא ניתן לטעון את רשימת המשתמשים</b>' +
      'שגיאה מ-Firebase: <code>' + usersLoadError + '</code><br>' +
      'יש לוודא בהגדרות ה-Realtime Database שהנתיב <code>usersState</code> מאושר לקריאה וכתיבה.';
    board.appendChild(errBox);
    return;
  }

  const wrap = document.createElement('div');
  wrap.className = 'category';
  wrap.style.maxWidth = '820px';
  wrap.style.margin = '0 auto';

  const header = document.createElement('div');
  header.className = 'category-header';
  const title = document.createElement('div');
  title.className = 'category-title';
  title.innerText = 'ניהול משתמשים';
  header.appendChild(title);
  wrap.appendChild(header);

  const usernames = Object.keys(usersData).sort((a, b) => a.localeCompare(b, 'he'));

  const colHeaderRow = document.createElement('div');
  colHeaderRow.className = 'question-block';
  colHeaderRow.style.alignItems = 'center';

  const nameColHeader = document.createElement('div');
  nameColHeader.style.minWidth = '110px';
  nameColHeader.style.maxWidth = '140px';
  nameColHeader.style.fontSize = '11.5px';
  nameColHeader.style.color = '#888';
  nameColHeader.style.textAlign = 'center';
  nameColHeader.innerText = 'שם יוזר';
  colHeaderRow.appendChild(nameColHeader);

  const passColHeader = document.createElement('div');
  passColHeader.style.flex = '1';
  passColHeader.style.minWidth = '120px';
  passColHeader.style.fontSize = '11.5px';
  passColHeader.style.color = '#888';
  passColHeader.style.textAlign = 'center';
  passColHeader.innerText = 'סיסמא';
  colHeaderRow.appendChild(passColHeader);

  wrap.appendChild(colHeaderRow);

  usernames.forEach(username => {
    const row = document.createElement('div');
    row.className = 'question-block';
    row.style.alignItems = 'center';

    const nameInput = document.createElement('input');
    nameInput.type = 'text';
    nameInput.value = username;
    nameInput.title = 'שם משתמש - ניתן לערוך';
    nameInput.style.minWidth = '110px';
    nameInput.style.maxWidth = '140px';
    nameInput.style.fontWeight = 'bold';
    nameInput.style.padding = '6px 8px';
    nameInput.style.border = '1px solid #ccc';
    nameInput.style.borderRadius = '6px';
    nameInput.style.fontSize = '13px';
    nameInput.onchange = () => {
      const newName = nameInput.value.trim();
      if(!newName || newName === username){
        nameInput.value = username;
        return;
      }
      if((newName === ADMIN_USERNAME && username !== ADMIN_USERNAME) || Object.prototype.hasOwnProperty.call(usersData, newName)){
        alert('שם המשתמש כבר קיים.');
        nameInput.value = username;
        return;
      }
      const pass = usersData[username];
      delete usersData[username];
      usersData[newName] = pass;
      if(Object.prototype.hasOwnProperty.call(adminUsersData, username)){
        const wasAdmin = adminUsersData[username];
        delete adminUsersData[username];
        adminUsersData[newName] = wasAdmin;
        saveAdminsToFirebase();
      }
      if(currentUser === username) currentUser = newName;
      saveUsersToFirebase();
      render();
    };
    row.appendChild(nameInput);

    const passInput = document.createElement('input');
    passInput.type = 'text';
    passInput.value = usersData[username];
    passInput.title = 'סיסמה - ניתן לערוך';
    passInput.style.flex = '1';
    passInput.style.minWidth = '120px';
    passInput.style.padding = '6px 8px';
    passInput.style.border = '1px solid #ccc';
    passInput.style.borderRadius = '6px';
    passInput.style.fontSize = '13px';
    passInput.onchange = () => {
      const val = passInput.value.trim();
      if(!val){
        passInput.value = usersData[username];
        return;
      }
      usersData[username] = val;
      saveUsersToFirebase();
    };
    row.appendChild(passInput);

    const adminLabel = document.createElement('label');
    adminLabel.style.display = 'flex';
    adminLabel.style.alignItems = 'center';
    adminLabel.style.gap = '4px';
    adminLabel.style.fontSize = '13px';
    adminLabel.style.whiteSpace = 'nowrap';
    adminLabel.style.cursor = (username === ADMIN_USERNAME) ? 'default' : 'pointer';

    const adminCheckbox = document.createElement('input');
    adminCheckbox.type = 'checkbox';
    adminCheckbox.checked = (username === ADMIN_USERNAME) ? true : !!adminUsersData[username];
    adminCheckbox.style.accentColor = 'var(--accent)';
    const isProtectedAdmin = (username === ADMIN_USERNAME);
    adminCheckbox.onclick = (e) => {
      if(isProtectedAdmin){
        e.preventDefault();
      }
    };
    adminCheckbox.onchange = () => {
      if(isProtectedAdmin){
        adminCheckbox.checked = true;
        return;
      }
      if(adminCheckbox.checked){
        adminUsersData[username] = true;
      } else {
        delete adminUsersData[username];
      }
      saveAdminsToFirebase();
    };
    adminLabel.appendChild(adminCheckbox);
    adminLabel.appendChild(document.createTextNode('הרשאת מנהל'));
    row.appendChild(adminLabel);

    const delBtn = document.createElement('button');
    delBtn.className = 'btn-del';
    delBtn.innerText = '🗑';
    delBtn.title = 'מחיקת משתמש';
    delBtn.onclick = () => {
      if(username === ADMIN_USERNAME){
        alert('לא ניתן למחוק את חשבון המנהל.');
        return;
      }
      if(confirm('למחוק את המשתמש "' + username + '"?')){
        delete usersData[username];
        if(Object.prototype.hasOwnProperty.call(adminUsersData, username)){
          delete adminUsersData[username];
          saveAdminsToFirebase();
        }
        saveUsersToFirebase();
        render();
      }
    };
    row.appendChild(delBtn);

    wrap.appendChild(row);
  });

  // הוספת משתמש חדש
  const addRow = document.createElement('div');
  addRow.className = 'add-row';

  const newUserInput = document.createElement('input');
  newUserInput.type = 'text';
  newUserInput.placeholder = 'שם משתמש חדש';
  newUserInput.style.maxWidth = '160px';

  const newPassInput = document.createElement('input');
  newPassInput.type = 'text';
  newPassInput.placeholder = 'סיסמה';

  const doAddUser = () => {
    const uname = newUserInput.value.trim();
    const pass = newPassInput.value.trim();
    if(!uname || !pass) return;
    if(Object.prototype.hasOwnProperty.call(usersData, uname)){
      alert('שם המשתמש כבר קיים.');
      return;
    }
    usersData[uname] = pass;
    saveUsersToFirebase();
    render();
  };
  newUserInput.onkeydown = (e) => { if(e.key === 'Enter') doAddUser(); };
  newPassInput.onkeydown = (e) => { if(e.key === 'Enter') doAddUser(); };

  const addBtn = document.createElement('button');
  addBtn.innerText = '+ הוסף משתמש';
  addBtn.onclick = doAddUser;

  addRow.appendChild(newUserInput);
  addRow.appendChild(newPassInput);
  addRow.appendChild(addBtn);
  wrap.appendChild(addRow);

  board.appendChild(wrap);
}

// דיספצ'ר תצוגה: מציג את הלוח הרגיל, את דף ההיסטוריה, או את דף ניהול המשתמשים, לפי currentView
function render(){
  const toggleBtn = document.getElementById('historyToggleBtn');
  if(toggleBtn){
    toggleBtn.innerText = (currentView === 'history') ? 'חזרה ללוח' : 'היסטוריה';
  }
  const adminBtn = document.getElementById('usersAdminBtn');
  if(adminBtn){
    adminBtn.style.display = isAdmin() ? '' : 'none';
    adminBtn.innerText = (currentView === 'users') ? 'חזרה לשאלות ובקשות' : 'ניהול משתמשים';
  }
  if(currentView === 'users' && !isAdmin()){
    // הגנה: אם משום מה מנסים להציג את דף המשתמשים כשלא מדובר במנהל, חוזרים ללוח
    currentView = 'board';
  }
  const pageTitle = document.getElementById('pageTitle');
  if(pageTitle){
    pageTitle.innerText = (currentView === 'history') ? 'היסטוריית משמרות' :
      (currentView === 'users') ? 'משתמשים' : 'שאלות ובקשות משמרת';
  }
  const todayDateEl = document.getElementById('todayDate');
  if(todayDateEl){
    todayDateEl.style.display = (currentView === 'users') ? 'none' : '';
  }
  if(currentView === 'history'){
    renderHistory();
  } else if(currentView === 'users'){
    renderUsersPage();
  } else {
    renderBoard();
  }
}

document.addEventListener('click', (e) => {
  if(e.target.tagName === 'IMG' && e.target.closest('[contenteditable="true"]')){
    e.preventDefault();
    openImageResizePopup(e.target);
  } else if(activeResizeImg && !e.target.closest('.image-resize-popup')){
    closeImageResizePopup();
  }

  let needsRender = false;
  if(openMarkPopup && !e.target.closest('.mark-tools')){
    openMarkPopup = null;
    needsRender = true;
  }
  if(openAddCommentPopup && !e.target.closest('.btn-add-comment') && !e.target.closest('.add-comment-popup')){
    openAddCommentPopup = null;
    needsRender = true;
  }
  if(openRowAddPopup && !e.target.closest('.btn-add-comment') && !e.target.closest('.add-comment-popup')){
    openRowAddPopup = null;
    needsRender = true;
  }
  if(openQuestionMenu && !e.target.closest('.question-menu')){
    openQuestionMenu = null;
    needsRender = true;
  }
  if(needsRender) render();
});
