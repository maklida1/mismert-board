<!-- טעינת ספריות Firebase CDN (גרסת SDK v8 המקבלת את firebase גלובלי) -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
  // השוואה עמוקה שלא רגישה לסדר מפתחות - Firebase לא תמיד שומר על סדר המפתחות המקורי
  function deepEqual(a, b) {
    if (a === b) return true;
    if (typeof a !== 'object' || typeof b !== 'object' || a === null || b === null) return false;
    if (Array.isArray(a) !== Array.isArray(b)) return false;
    const keysA = Object.keys(a);
    const keysB = Object.keys(b);
    if (keysA.length !== keysB.length) return false;
    for (const key of keysA) {
      if (!deepEqual(a[key], b[key])) return false;
    }
    return true;
  }

  const firebaseConfig = {
    apiKey: "AIzaSyBtUvDSrt9-jCorJR0avkNqC4qySmyaNfM",
    authDomain: "mismert-8952a.firebaseapp.com",
    databaseURL: "https://mismert-8952a-default-rtdb.firebaseio.com",
    projectId: "mismert-8952a",
    storageBucket: "mismert-8952a.firebasestorage.app",
    messagingSenderId: "148589046902",
    appId: "1:148589046902:web:d926763430bb8d13ed4357",
    measurementId: "G-HXQV8HNV6N"
  };

  let database = null;
  let historyData = {};
  let historyLoadError = null;

  // רשימת ברירת המחדל של המשתמשים - משמשת רק כדי לאכלס את Firebase בפעם הראשונה.
  // לאחר מכן, המקור האמיתי הוא הנתיב usersState ב-Firebase, וכל שינוי (הוספה/מחיקה/עריכה)
  // שמנהל המערכת (Yuval) עושה בדף "ניהול משתמשים" נשמר שם ומסתנכרן לכל המכשירים.
  const DEFAULT_USERS = {
    'maklida2': 'Dd5050**',
    'maklida3': 'Dd5050**',
    'hemed': 'Yuval1948',
    'office2': 'Ss5050**',
    'Yuval': '0525343434',
    'night1': '1234',
    'night2': '1234',
    'Gidon': '0522745574'
  };
  let usersData = Object.assign({}, DEFAULT_USERS);
  let usersLoadError = null;

  // רשימת המשתמשים בעלי הרשאת מנהל - מסתנכרנת עם Firebase בנתיב adminUsersState.
  // Yuval הוא תמיד מנהל (הגנה כדי לא לנעול את הגישה לניהול בטעות).
  const DEFAULT_ADMINS = { 'Yuval': true, 'Gidon': true };
  let adminUsersData = Object.assign({}, DEFAULT_ADMINS);
  let adminUsersLoadError = null;

  // אתחול Firebase - עטוף ב-try/catch כדי שאם הטעינה נכשלת (למשל אין אינטרנט) הדף לא יישבר
  try {
    firebase.initializeApp(firebaseConfig);
    database = firebase.database();
    // סנכרון בזמן אמת מול Firebase עם השלמת רשימות ריקות
    database.ref('boardState').on('value', (snapshot) => {
      const data = snapshot.val();
      if (data && Array.isArray(data.categories)) {
        // Firebase מוחק מערכים ריקים, אז אנחנו משלימים אותם כאן כדי שהקוד לא יישבר
        data.categories.forEach(cat => {
          if (!cat.questions) cat.questions = [];
          if (['cat1', 'cat2', 'cat3', 'cat-night'].includes(cat.id)) cat.permanent = true;
          cat.questions.forEach(q => {
            if (!q.comments) q.comments = [];
            if (!q.commentMarks) q.commentMarks = [];
            if (!q.commentNights) q.commentNights = [];
            if (!q.commentNightsOn) q.commentNightsOn = [];
            if (!q.commentExtra) q.commentExtra = [];
            q.comments.forEach((c, i) => {
              if (!q.commentExtra[i]) q.commentExtra[i] = [];
              q.commentExtra[i].forEach(item => {
                if (!item.text) item.text = '';
              });
            });
          });
        });
        // Firebase מחזיר אלינו הד של הכתיבה שלנו עצמנו - אם הנתונים זהים למה שכבר יש,
        // מדובר בהד ולא בשינוי אמיתי ממישהו אחר, אז מדלגים על render() כדי לא לאפס פוקוס/חצים
        if (deepEqual(data, state)) return;
        state = data;
        render();
      } else if (!data) {
        // מסד הנתונים ריק לגמרי (פעם ראשונה) - נשמור את ברירת המחדל כדי שכל המכשירים יתחילו מאותה נקודה
        saveStateToFirebase();
      } else {
        console.error('Ignoring malformed data from Firebase:', data);
      }
    }, (err) => {
      console.error('Firebase read failed (check your database Rules):', err);
    });

    // סנכרון בזמן אמת מול היסטוריית השאלות שנמחקו (לפי תאריך מחיקה)
    database.ref('historyState').on('value', (snapshot) => {
      historyData = snapshot.val() || {};
      historyLoadError = null;
      if (typeof currentView !== 'undefined' && currentView === 'history') render();
    }, (err) => {
      console.error('Firebase history read failed (check your database Rules):', err);
      historyLoadError = (err && err.message) ? err.message : 'שגיאה לא ידועה';
      if (typeof currentView !== 'undefined' && currentView === 'history') render();
    });

    // סנכרון בזמן אמת מול רשימת המשתמשים (שם + סיסמה), כדי ששינויים של המנהל יחולו על כל המכשירים
    database.ref('usersState').on('value', (snapshot) => {
      const data = snapshot.val();
      if (data && typeof data === 'object' && Object.keys(data).length > 0) {
        usersData = data;
        usersLoadError = null;
        // ממזגים משתמשי ברירת מחדל חדשים שנוספו בקוד ועדיין לא קיימים ב-Firebase,
        // בלי לגעת במשתמשים/סיסמאות קיימים (כולל שינויים שהמנהל עשה בעצמו)
        let mergedAny = false;
        Object.keys(DEFAULT_USERS).forEach((uname) => {
          if (!Object.prototype.hasOwnProperty.call(usersData, uname)) {
            usersData[uname] = DEFAULT_USERS[uname];
            mergedAny = true;
          }
        });
        if (mergedAny) {
          database.ref('usersState').set(usersData).catch((err) => {
            console.error('Firebase USERS MERGE failed:', err);
          });
        }
        if (typeof currentView !== 'undefined' && currentView === 'users') render();
      } else if (!data) {
        // אין עדיין רשימת משתמשים ב-Firebase (פעם ראשונה) - נשמור את ברירת המחדל
        database.ref('usersState').set(DEFAULT_USERS).catch((err) => {
          console.error('Firebase USERS SEED failed:', err);
        });
      }
    }, (err) => {
      console.error('Firebase users read failed (check your database Rules):', err);
      usersLoadError = (err && err.message) ? err.message : 'שגיאה לא ידועה';
      if (typeof currentView !== 'undefined' && currentView === 'users') render();
    });

    // סנכרון בזמן אמת מול רשימת הרשאות המנהל (מי מהמשתמשים הוא מנהל), כדי ששינויים יחולו על כל המכשירים
    database.ref('adminUsersState').on('value', (snapshot) => {
      const data = snapshot.val();
      if (data && typeof data === 'object' && Object.keys(data).length > 0) {
        adminUsersData = data;
        adminUsersLoadError = null;
        // ממזגים מנהלי ברירת מחדל חדשים שנוספו בקוד ועדיין לא קיימים ב-Firebase
        // (כולל הבטחה ש-Yuval תמיד מנהל, כדי לא לנעול בטעות את הגישה לניהול)
        let adminsMergedAny = false;
        Object.keys(DEFAULT_ADMINS).forEach((uname) => {
          if (!Object.prototype.hasOwnProperty.call(adminUsersData, uname)) {
            adminUsersData[uname] = true;
            adminsMergedAny = true;
          }
        });
        if (adminsMergedAny) {
          database.ref('adminUsersState').set(adminUsersData).catch((err) => {
            console.error('Firebase ADMINS MERGE failed:', err);
          });
        }
        if (typeof currentUser !== 'undefined' && currentUser) {
          const adminBtn = document.getElementById('usersAdminBtn');
          if (adminBtn) adminBtn.style.display = isAdmin() ? '' : 'none';
        }
        if (typeof currentView !== 'undefined' && currentView === 'users') render();
      } else if (!data) {
        // אין עדיין רשימת הרשאות מנהל ב-Firebase (פעם ראשונה) - נשמור את ברירת המחדל
        database.ref('adminUsersState').set(adminUsersData).catch((err) => {
          console.error('Firebase ADMINS SEED failed:', err);
        });
      }
    }, (err) => {
      console.error('Firebase admin users read failed (check your database Rules):', err);
      adminUsersLoadError = (err && err.message) ? err.message : 'שגיאה לא ידועה';
      if (typeof currentView !== 'undefined' && currentView === 'users') render();
    });
  } catch (err) {
    console.error('Firebase init failed:', err);
  }

  // פונקציה לשמירה בכל שינוי
  function saveStateToFirebase() {
    if (!database) return;
    database.ref('boardState').set(state).catch((err) => {
      console.error('Firebase SAVE failed (check your database Rules for write access):', err);
    });
  }

  // מחזיר מפתח תאריך בפורמט YYYY-MM-DD (לפי שעון מקומי) לשימוש בהיסטוריית משמרות
  function getTodayDateKey() {
    const d = new Date();
    const yyyy = d.getFullYear();
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    return yyyy + '-' + mm + '-' + dd;
  }

  // מארכב שאלה שנמחקה להיסטוריית המשמרות, לפי תאריך היום וקטגוריה.
  // שימוש ב-push (לא set על כל המערך) כדי שכמה מכשירים שמוחקים שאלות במקביל לא ידרסו זה את זה.
  function archiveDeletedQuestion(cat, q) {
    if (!database) return;
    if (typeof currentUser !== 'undefined' && currentUser) q.deletedBy = currentUser;
    q.deletedAt = nowHM();
    const dateKey = getTodayDateKey();
    const catRef = database.ref('historyState/' + dateKey + '/' + cat.id);
    catRef.child('title').set(cat.title);
    catRef.child('questions').push(q).catch((err) => {
      console.error('Firebase ARCHIVE failed:', err);
    });
  }
</script>

          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h9"></path>
            <path d="M10 12h11"></path>

<script>
// --- ניהול משתמשים / התחברות ---
// הערה: זו הגנה בסיסית בצד הלקוח לנוחות בלבד - רשימת המשתמשים (usersData) מסתנכרנת עם
// Firebase, אבל מי שמסתכל בקוד המקור של הדף עדיין יכול לראות אותה - זה לא אמצעי אבטחה אמיתי.
const ADMIN_USERNAME = 'Yuval';
let currentUser = null;

function isAdmin(){
  return currentUser === ADMIN_USERNAME || !!(currentUser && adminUsersData && adminUsersData[currentUser]);
}

function showApp(username){
  currentUser = username;
  const loginScreen = document.getElementById('loginScreen');
  const appRoot = document.getElementById('appRoot');
  if(loginScreen) loginScreen.style.display = 'none';
  if(appRoot) appRoot.style.display = '';
  const label = document.getElementById('currentUserLabel');
  if(label) label.innerText = username;
  const adminBtn = document.getElementById('usersAdminBtn');
  if(adminBtn) adminBtn.style.display = isAdmin() ? '' : 'none';
  render();
}

function attemptLogin(){
  const userInput = document.getElementById('loginUsername');
  const passInput = document.getElementById('loginPassword');
  const errBox = document.getElementById('loginError');
  const username = (userInput && userInput.value || '').trim();
  const password = (passInput && passInput.value) || '';
  if(Object.prototype.hasOwnProperty.call(usersData, username) && usersData[username] === password){
    if(errBox) errBox.style.display = 'none';
    try { localStorage.setItem('loggedInUser', username); } catch(e){}
    showApp(username);
  } else {
    if(errBox){
      errBox.innerText = 'שם משתמש או סיסמה שגויים';
      errBox.style.display = 'block';
    }
    if(passInput) passInput.value = '';
  }
}

function logoutUser(){
  try { localStorage.removeItem('loggedInUser'); } catch(e){}
  currentUser = null;
  location.reload();
}

function tryAutoLogin(){
  let saved = null;
  try { saved = localStorage.getItem('loggedInUser'); } catch(e){}
  if(saved && Object.prototype.hasOwnProperty.call(usersData, saved)){
    showApp(saved);
  }
}

function renderTodayDate(){
  const days = ['יום ראשון', 'יום שני', 'יום שלישי', 'יום רביעי', 'יום חמישי', 'יום שישי', 'יום שבת'];
  const now = new Date();
  const dayName = days[now.getDay()];
  const dd = String(now.getDate()).padStart(2, '0');
  const mm = String(now.getMonth() + 1).padStart(2, '0');
  const yy = String(now.getFullYear()).slice(-2);
  const dateStr = dd + '/' + mm + '/' + yy;
  const el = document.getElementById('todayDate');
  if(el) el.innerText = dayName + ' ' + dateStr;
}
renderTodayDate();

let state = {
  categories: [
    {
      id: 'cat1',
      title: 'קוליות',
      questions: [],
      permanent: true
    },
    {
      id: 'cat2',
      title: 'מיילים',
      questions: [],
      permanent: true
    },
    {
      id: 'cat3',
      title: 'מרקטמן',
      questions: [],
      permanent: true
    },
    {
      id: 'cat-night',
      title: 'בקשות נייט',
      questions: [],
      mode: 'night',
      permanent: true
    }
  ]
};

let currentView = 'board'; // 'board' או 'history'
let historySelectedDateKey = null; // תאריך (YYYY-MM-DD) המוצג כרגע בעמוד ההיסטוריה; null = ברירת מחדל (החדש ביותר עם נתונים)
let lastFocusCatId = null;
let lastFocusNewQid = null;
let lastFocusCommentQid = null;
let lastFocusCommentIdx = null;
let lastFocusNightQid = null;
let lastFocusNightIdx = null;
let navOrder = [];
let flatNav = [];
let questionNav = [];

function isCaretOnFirstLine(el){
  const sel = window.getSelection();
  if(!sel.rangeCount) return true;
  const range = sel.getRangeAt(0).cloneRange();
  range.collapse(true);
  let rects = range.getClientRects();
  if(rects.length === 0) rects = [el.getBoundingClientRect()];
  const caretRect = rects[0];
  const elRect = el.getBoundingClientRect();
  return (caretRect.top - elRect.top) < (caretRect.height / 2 + 2);
}
function isCaretOnLastLine(el){
  const sel = window.getSelection();
  if(!sel.rangeCount) return true;
  const range = sel.getRangeAt(0).cloneRange();
  range.collapse(true);
  let rects = range.getClientRects();
  if(rects.length === 0) rects = [el.getBoundingClientRect()];
  const caretRect = rects[0];
  const elRect = el.getBoundingClientRect();
  return (elRect.bottom - caretRect.bottom) < (caretRect.height / 2 + 2);
}
function normalizeEmptyOnBlur(el){
  if(el.textContent.trim() === '' && !el.querySelector('img') && el.innerHTML !== ''){
    el.innerHTML = '';
  }
}

function getCaretOffset(el){
  const sel = window.getSelection();
  if(sel.rangeCount === 0) return 0;
  const range = sel.getRangeAt(0);
  if(!el.contains(range.startContainer)) return 0;
  const preRange = document.createRange();
  preRange.selectNodeContents(el);
  preRange.setEnd(range.startContainer, range.startOffset);
  return preRange.toString().length;
}
function placeCaretAtEnd(el){
  const range = document.createRange();
  const sel = window.getSelection();
  range.selectNodeContents(el);
  range.collapse(false);
  sel.removeAllRanges();
  sel.addRange(range);
}
function placeCaretAtStart(el){
  const range = document.createRange();
  const sel = window.getSelection();
  range.selectNodeContents(el);
  range.collapse(true);
  sel.removeAllRanges();
  sel.addRange(range);
}
function findQuestionByQid(qid){
  for(const cat of state.categories){
    const q = cat.questions.find(q => q.id === qid);
    if(q) return q;
  }
  return null;
}
function extrasFor(qid, idx){
  const q = findQuestionByQid(qid);
  return (q && q.commentExtra && q.commentExtra[idx]) || [];
}
function focusExtra(qid, idx, subIdx, atStart){
  const el = document.querySelector(`[data-qid="${qid}"][data-col="extra"][data-idx="${idx}"][data-subidx="${subIdx}"]`);
  if(!el) return false;
  el.focus();
  if(atStart) placeCaretAtStart(el); else placeCaretAtEnd(el);
  return true;
}
// זז קדימה מתוך הפריט האחרון של שרשור idx נתון: לפריט הראשון בשורה הבאה ב-flatNav
function focusForwardFromRowEnd(qid, idx){
  const pos = flatIndexOf(qid, idx);
  if(pos !== -1 && pos + 1 < flatNav.length){
    return focusFlatItemForward(flatNav[pos + 1], true);
  }
  return false;
}
function focusFieldEnd(qid, col){
  const el = document.querySelector(`[data-qid="${qid}"][data-col="${col}"]`);
  if(!el) return;
  el.focus();
  placeCaretAtEnd(el);
}
function focusFieldStart(qid, col){
  const el = document.querySelector(`[data-qid="${qid}"][data-col="${col}"]`);
  if(!el) return;
  el.focus();
  placeCaretAtStart(el);
}
function queryFlatEl(item, columnType){
  if(item.idx === null || item.idx === undefined){
    const col = columnType === 'primary' ? 'text' : 'answer';
    return document.querySelector(`[data-qid="${item.qid}"][data-col="${col}"]`);
  }
  const col = columnType === 'primary' ? 'comment' : 'commentNight';
  return document.querySelector(`[data-qid="${item.qid}"][data-col="${col}"][data-idx="${item.idx}"]`);
}
function focusFlatItemAt(item, columnType, atStart){
  if(!item) return false;
  if(item.qid === null){
    const el = document.getElementById('add-input-' + item.catId);
    if(!el) return false;
    el.focus();
    if(atStart) placeCaretAtStart(el); else placeCaretAtEnd(el);
    return true;
  }
  let el = queryFlatEl(item, columnType);
  if(!el && columnType === 'secondary'){
    el = queryFlatEl(item, 'primary');
  }
  if(!el) return false;
  el.focus();
  if(atStart) placeCaretAtStart(el); else placeCaretAtEnd(el);
  return true;
}
// כמו focusFlatItemAt, אבל לשימוש ספציפי כשמתקדמים לשורה חדשה: אם השדה הראשי (comment/text) לא קיים בפועל
// (למשל תגובה ריקה שהוסתרה כי יש אחריה נייט), נופלים ל-secondary של אותה שורה במקום להיכשל בשקט
function focusFlatItemForward(item, atStart){
  if(!item) return false;
  if(item.qid === null){
    return focusFlatItemAt(item, 'primary', atStart);
  }
  let el = queryFlatEl(item, 'primary');
  if(!el) el = queryFlatEl(item, 'secondary');
  if(!el) return false;
  el.focus();
  if(atStart) placeCaretAtStart(el); else placeCaretAtEnd(el);
  return true;
}
function focusFlatItem(item, columnType){
  return focusFlatItemAt(item, columnType, false);
}
function flatIndexOf(qid, idx){
  const normIdx = (idx === undefined) ? null : idx;
  return flatNav.findIndex(item => item.qid === qid && item.idx === normIdx);
}
// זז אנכית בין שאלות בלבד (מדלג לגמרי על תגובות/נייטים של השאלה) - לשימוש בשדה השאלה/תשובה העליון
function moveQuestionVertical(qid, columnType, dir){
  const pos = questionNav.findIndex(item => item.qid === qid);
  if(pos === -1) return false;
  const newPos = pos + dir;
  if(newPos < 0 || newPos >= questionNav.length) return false;
  const targetQid = questionNav[newPos].qid;
  let el = queryFlatEl({qid: targetQid, idx: null}, columnType);
  if(!el && columnType === 'secondary'){
    el = queryFlatEl({qid: targetQid, idx: null}, 'primary');
  }
  if(!el) return false;
  el.focus();
  placeCaretAtEnd(el);
  return true;
}
function moveFlatVertical(qid, idx, columnType, dir){
  const pos = flatIndexOf(qid, idx);
  if(pos === -1) return;
  const newPos = pos + dir;
  if(newPos < 0 || newPos >= flatNav.length) return;
  focusFlatItem(flatNav[newPos], columnType);
}
function goForwardFromField(qid, normIdx, columnType){
  if(columnType === 'primary'){
    if(normIdx === null){
      const answerEl = document.querySelector(`[data-qid="${qid}"][data-col="answer"]:not([data-idx])`);
      if(answerEl){
        answerEl.focus();
        placeCaretAtStart(answerEl);
        return true;
      }
      const pos = flatIndexOf(qid, normIdx);
      if(pos !== -1 && pos + 1 < flatNav.length){
        return focusFlatItemForward(flatNav[pos + 1], true);
      }
      return false;
    }
    const nightEl = document.querySelector(`[data-qid="${qid}"][data-col="commentNight"][data-idx="${normIdx}"]`);
    if(nightEl){
      nightEl.focus();
      placeCaretAtStart(nightEl);
      return true;
    }
    const extras = extrasFor(qid, normIdx);
    return extras.length > 0 ? focusExtra(qid, normIdx, 0, true) : focusForwardFromRowEnd(qid, normIdx);
  } else {
    if(normIdx !== null){
      const extras = extrasFor(qid, normIdx);
      return extras.length > 0 ? focusExtra(qid, normIdx, 0, true) : focusForwardFromRowEnd(qid, normIdx);
    }
    const pos = flatIndexOf(qid, normIdx);
    if(pos !== -1 && pos + 1 < flatNav.length){
      return focusFlatItemForward(flatNav[pos + 1], true);
    }
    return false;
  }
}
function goBackwardFromField(qid, normIdx, columnType){
  if(columnType === 'secondary'){
    const el = queryFlatEl({qid, idx: normIdx}, 'primary');
    if(el){
      el.focus();
      placeCaretAtEnd(el);
      return true;
    }
    // אין תגובת מקליד/ה (מוסתרת כי ריקה) - ממשיכים אחורה כאילו זו הייתה תחילת השורה
  }
  const pos = flatIndexOf(qid, normIdx);
  if(pos > 0){
    return focusFlatItemAt(flatNav[pos - 1], 'secondary', false);
  }
  return false;
}
function handleFieldNav(e, qid, idx, columnType){
  const el = e.currentTarget;
  const normIdx = (idx === undefined) ? null : idx;
  if(e.key === 'ArrowUp'){
    if(isCaretOnFirstLine(el)){
      e.preventDefault();
      if(normIdx === null){
        moveQuestionVertical(qid, columnType, -1);
      } else {
        goBackwardFromField(qid, normIdx, columnType);
      }
    }
  } else if(e.key === 'ArrowDown'){
    if(isCaretOnLastLine(el)){
      e.preventDefault();
      if(normIdx === null){
        moveQuestionVertical(qid, columnType, 1);
      } else {
        goForwardFromField(qid, normIdx, columnType);
      }
    }
  } else if(e.key === 'ArrowLeft'){
    if(getCaretOffset(el) === el.textContent.length){
      const moved = goForwardFromField(qid, normIdx, columnType);
      if(moved) e.preventDefault();
    }
  } else if(e.key === 'ArrowRight'){
    if(getCaretOffset(el) === 0){
      const moved = goBackwardFromField(qid, normIdx, columnType);
      if(moved) e.preventDefault();
    }
  }
}

// ניווט בחצים בתוך פריטי ה"המשך שרשור" (נייט/מקליד/ה שנוספו אחרי הנייט הראשון) -
// מזיז אחורה/קדימה בשרשור עצמו, ובקצוות ממשיך אל הנייט/תגובה שלפניו או אל השורה הבאה שאחריו
function focusExtraOrFallback(qid, idx, subIdx, atStart){
  const el = document.querySelector(`[data-qid="${qid}"][data-col="extra"][data-idx="${idx}"][data-subidx="${subIdx}"]`);
  if(el){
    el.focus();
    if(atStart) placeCaretAtStart(el); else placeCaretAtEnd(el);
    return true;
  }
  return false;
}
function handleExtraNav(e, qid, idx, subIdx, extraCount){
  const el = e.currentTarget;
  const goBackward = () => {
    if(subIdx > 0) return focusExtraOrFallback(qid, idx, subIdx - 1, false);
    const nightEl = document.querySelector(`[data-qid="${qid}"][data-col="commentNight"][data-idx="${idx}"]`);
    if(nightEl){ nightEl.focus(); placeCaretAtEnd(nightEl); return true; }
    const commentEl = document.querySelector(`[data-qid="${qid}"][data-col="comment"][data-idx="${idx}"]`);
    if(commentEl){ commentEl.focus(); placeCaretAtEnd(commentEl); return true; }
    return false;
  };
  const goForward = () => {
    if(subIdx < extraCount - 1) return focusExtraOrFallback(qid, idx, subIdx + 1, true);
    return focusForwardFromRowEnd(qid, idx);
  };
  if(e.key === 'ArrowUp'){
    if(isCaretOnFirstLine(el)){
      e.preventDefault();
      goBackward();
    }
  } else if(e.key === 'ArrowDown'){
    if(isCaretOnLastLine(el)){
      e.preventDefault();
      goForward();
    }
  } else if(e.key === 'ArrowLeft'){
    if(getCaretOffset(el) === el.textContent.length){
      e.preventDefault();
      goForward();
    }
  } else if(e.key === 'ArrowRight'){
    if(getCaretOffset(el) === 0){
      e.preventDefault();
      goBackward();
    }
  }
}

function focusPrevCategoryEnd(idx){
  if(idx < 0) return;
  const cat = state.categories[idx];
  if(cat.questions.length > 0){
    focusFieldEnd(cat.questions[cat.questions.length - 1].id, 'text');
  } else {
    focusPrevCategoryEnd(idx - 1);
  }
}

function handleAddInputNav(e, catId){
  if(e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
  e.preventDefault();
  const catIndex = state.categories.findIndex(c => c.id === catId);
  if(e.key === 'ArrowUp'){
    const cat = state.categories[catIndex];
    if(cat.questions.length > 0){
      focusFieldEnd(cat.questions[cat.questions.length - 1].id, 'text');
    } else {
      focusPrevCategoryEnd(catIndex - 1);
    }
  } else {
    if(catIndex < state.categories.length - 1){
      const nextCat = state.categories[catIndex + 1];
      if(nextCat.questions.length > 0){
        focusFieldEnd(nextCat.questions[0].id, 'text');
      } else {
        const nextInput = document.getElementById('add-input-' + nextCat.id);
        if(nextInput) nextInput.focus();
      }
    }
  }
}

function insertLineBreakAtCaret(){
  document.execCommand('insertLineBreak', false, null);
}

function attachImagePaste(el, onChange){
  el.addEventListener('paste', (e) => {
    const items = (e.clipboardData && e.clipboardData.items) || [];
    let imageItem = null;
    for(let i = 0; i < items.length; i++){
      if(items[i].type && items[i].type.indexOf('image/') === 0){
        imageItem = items[i];
        break;
      }
    }
    e.preventDefault();
    if(imageItem){
      const file = imageItem.getAsFile();
      const reader = new FileReader();
      reader.onload = () => {
        document.execCommand('insertImage', false, reader.result);
        // נותנים לתמונה שהודבקה גודל התחלתי סביר, כדי שלא תיכנס בגודל המקורי (לרוב ענק מדי)
        const imgs = el.querySelectorAll('img[src="' + reader.result + '"]');
        const newImg = imgs[imgs.length - 1];
        if(newImg && !newImg.style.width){
          newImg.onload = () => {
            const naturalW = newImg.naturalWidth || 320;
            newImg.style.width = Math.min(naturalW, 320) + 'px';
          };
          if(newImg.complete && newImg.naturalWidth){
            newImg.style.width = Math.min(newImg.naturalWidth, 320) + 'px';
          }
        }
        if(onChange) onChange();
      };
      reader.readAsDataURL(file);
    } else {
      const text = (e.clipboardData && e.clipboardData.getData('text/plain')) || '';
      document.execCommand('insertText', false, text);
      if(onChange) onChange();
    }
  });
}

function uid(prefix){
  return prefix + '_' + Math.random().toString(36).slice(2,9);
}

// מחזיר שעה נוכחית בפורמט HH:MM (לשימוש בתיעוד מי עשה מה ומתי)
function nowHM(){
  const d = new Date();
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

// פותח כלי קטן לשליטה בגודל תמונה שהודבקה בתוך שאלה/נייט
// שומר את השינוי בגודל תמונה - מפעיל את מנגנון השמירה הרגיל של השדה שבו התמונה נמצאת
function persistImageChange(img){
  const editable = img.closest('[contenteditable="true"]');
  if(editable) editable.dispatchEvent(new Event('input', { bubbles: true }));
}

function buildImageSizeRow(labelText, img, styleProp, minPx, maxPx, defaultPx){
  const row = document.createElement('div');
  row.className = 'image-resize-row';

  const label = document.createElement('span');
  label.innerText = labelText;
  row.appendChild(label);

  const currentVal = parseInt(img.style[styleProp]) || defaultPx;

  const slider = document.createElement('input');
  slider.type = 'range';
  slider.min = String(minPx);
  slider.max = String(maxPx);
  slider.value = String(currentVal);

  const valLabel = document.createElement('span');
  valLabel.className = 'image-resize-percent';
  valLabel.innerText = currentVal + 'px';

  slider.oninput = () => {
    img.style[styleProp] = slider.value + 'px';
    if(styleProp === 'width') img.style.maxWidth = 'none';
    if(styleProp === 'height') img.style.maxHeight = 'none';
    valLabel.innerText = slider.value + 'px';
  };
  slider.onchange = () => persistImageChange(img);

  row.appendChild(slider);
  row.appendChild(valLabel);
  return row;
}

// פותח כלי קטן לשליטה עצמאית ברוחב ובגובה של תמונה שהודבקה בתוך שאלה/נייט
function openImageResizePopup(img){
  closeImageResizePopup();
  activeResizeImg = img;

  const popup = document.createElement('div');
  popup.className = 'image-resize-popup';
  popup.id = 'imageResizePopup';

  const naturalW = img.naturalWidth || 200;
  const naturalH = img.naturalHeight || 150;
  const defaultW = Math.round(img.getBoundingClientRect().width) || naturalW || 200;
  const defaultH = Math.round(img.getBoundingClientRect().height) || naturalH || 150;

  popup.appendChild(buildImageSizeRow('רוחב:', img, 'width', 30, 1200, defaultW));
  popup.appendChild(buildImageSizeRow('גובה:', img, 'height', 30, 1000, defaultH));

  document.body.appendChild(popup);

  const rect = img.getBoundingClientRect();
  let top = rect.top - popup.offsetHeight - 8;
  if(top < 4) top = rect.bottom + 8;
  let left = rect.left;
  const maxLeft = window.innerWidth - popup.offsetWidth - 8;
  if(left > maxLeft) left = Math.max(4, maxLeft);
  if(left < 4) left = 4;
  popup.style.top = top + 'px';
  popup.style.left = left + 'px';
}

function closeImageResizePopup(){
  const popup = document.getElementById('imageResizePopup');
  if(popup){
    // שומרים את הגודל הסופי גם אם המשתמש לא הזיז את הסליידר בפעם האחרונה
    if(activeResizeImg) persistImageChange(activeResizeImg);
    popup.remove();
  }
  activeResizeImg = null;
}

// מוסיף בסוגריים, בתוך האלמנט הנתון, מי ביצע את החלק הזה בשרשור ומתי (לדוגמה: "(maklida2 14:53)") - לשימוש בהיסטוריה
function appendAttr(el, by, at){
  if(!by && !at) return;
  const span = document.createElement('span');
  span.className = 'q-attr-inline';
  span.innerText = ' (' + (by || '?') + (at ? ' ' + at : '') + ')';
  el.appendChild(span);
}

function addCategory(inputId){
  const input = document.getElementById(inputId || 'new-cat-input');
  if(!input) return;
  const title = input.value.trim();
  if(!title) return;
  state.categories.push({id: uid('cat'), title: title, questions: []});
  input.value = '';
  render();
  saveStateToFirebase();
}

let pendingDeleteCatId = null;

function moveCategoryUp(catId){
  const idx = state.categories.findIndex(c => c.id === catId);
  if(idx <= 0) return;
  const tmp = state.categories[idx - 1];
  state.categories[idx - 1] = state.categories[idx];
  state.categories[idx] = tmp;
  render();
  saveStateToFirebase();
}

function moveCategoryDown(catId){
  const idx = state.categories.findIndex(c => c.id === catId);
  if(idx === -1 || idx >= state.categories.length - 1) return;
  const tmp = state.categories[idx + 1];
  state.categories[idx + 1] = state.categories[idx];
  state.categories[idx] = tmp;
  render();
  saveStateToFirebase();
}

function deleteCategory(catId){
  const cat = state.categories.find(c => c.id === catId);
  if(cat && cat.permanent) return;
  pendingDeleteCatId = catId;
  render();
}

function confirmDeleteCategory(){
  if(!pendingDeleteCatId) return;
  const cat = state.categories.find(c => c.id === pendingDeleteCatId);
  if(cat) cat.questions.forEach(q => archiveDeletedQuestion(cat, q));
  state.categories = state.categories.filter(c => c.id !== pendingDeleteCatId);
  pendingDeleteCatId = null;
  render();
  saveStateToFirebase();
}

function cancelDeleteCategory(){
  pendingDeleteCatId = null;
  render();
}

let pendingClear = null;

function clearQuestions(catId){
  const cat = state.categories.find(c => c.id === catId);
  if(!cat || cat.questions.length === 0) return;

  let mainCounter = 0;
  const notDoneNumbers = [];
  cat.questions.forEach(q => {
    if(!q.sub) mainCounter++;
    if(!q.done){
      notDoneNumbers.push(q.sub ? (mainCounter + '+') : String(mainCounter));
    }
  });

  if(notDoneNumbers.length > 0){
    pendingClear = {catId, notDoneNumbers};
    render();
    return;
  }

  cat.questions.forEach(q => archiveDeletedQuestion(cat, q));
  cat.questions = [];
  render();
  saveStateToFirebase();
}

function confirmClearQuestions(){
  if(!pendingClear) return;
  const cat = state.categories.find(c => c.id === pendingClear.catId);
  pendingClear = null;
  if(cat){
    cat.questions.forEach(q => archiveDeletedQuestion(cat, q));
    cat.questions = [];
  }
  render();
  saveStateToFirebase();
}

function cancelClearQuestions(){
  pendingClear = null;
  render();
}

// בודק אם שאלה ריקה לגמרי - בלי טקסט, בלי תמונה, בלי תשובה, בלי אף תגובה/נייט/פריט המשך
function isQuestionEmpty(q){
  const temp = document.createElement('div');
  temp.innerHTML = q.text || '';
  const hasImage = !!temp.querySelector('img');
  const hasText = temp.textContent.trim().length > 0;
  if(hasText || hasImage) return false;
  if(q.answer && q.answer.trim() !== '') return false;
  if(q.comments && q.comments.some(c => c && c.trim() !== '')) return false;
  if(q.commentNights && q.commentNights.some(c => c && c.trim() !== '')) return false;
  if(q.commentExtra && q.commentExtra.some(arr => arr && arr.some(item => item && item.text && item.text.trim() !== ''))) return false;
  return true;
}

// אם השאלה ריקה לגמרי - מוחק אותה מהמערך (בלי בקשת אישור, כמו שקורה כבר לתגובות/נייטים ריקים)
function deleteQuestionIfEmpty(catId, qId){
  const cat = state.categories.find(c => c.id === catId);
  if(!cat) return false;
  const q = cat.questions.find(q => q.id === qId);
  if(!q || !isQuestionEmpty(q)) return false;
  cat.questions = cat.questions.filter(qq => qq.id !== qId);
  render();
  saveStateToFirebase();
  return true;
}

function addQuestion(catId, html){
  const cat = state.categories.find(c => c.id === catId);
  if(!cat) return;
  const temp = document.createElement('div');
  temp.innerHTML = html || '';
  const hasImage = !!temp.querySelector('img');
  const hasText = temp.textContent.trim().length > 0;
  if(!hasText && !hasImage) return;
  cat.questions.push({id: uid('q'), text: html || '', answer: '', sub: false, done: false, comments: [], textMark: null, commentMarks: [], commentNights: [], commentNightsOn: [], commentExtra: [], createdBy: currentUser || null, createdAt: nowHM()});
  render();
  saveStateToFirebase();
}

function toggleIndent(catId, qId){
  const cat = state.categories.find(c => c.id === catId);
  const q = cat.questions.find(q => q.id === qId);
  q.sub = !q.sub;
  render();
  saveStateToFirebase();
}

function addSubQuestionAfter(catId, qId){
  const cat = state.categories.find(c => c.id === catId);
  const idx = cat.questions.findIndex(q => q.id === qId);
  if(idx === -1) return;
  const newQ = {id: uid('q'), text: '', answer: '', sub: true, done: false, comments: [], textMark: null, commentMarks: [], commentNights: [], commentNightsOn: [], commentExtra: [], createdBy: currentUser || null, createdAt: nowHM()};
  cat.questions.splice(idx + 1, 0, newQ);
  lastFocusNewQid = newQ.id;

function toggleDone(catId, qId){
  const cat = state.categories.find(c => c.id === catId);
  const q = cat.questions.find(q => q.id === qId);
  q.done = !q.done;
  q.doneBy = q.done ? (currentUser || null) : null;
  q.doneAt = q.done ? nowHM() : null;

  saveStateToFirebase();
}

let pendingDeleteQid = null;

function deleteQuestion(catId, qId){
  const cat = state.categories.find(c => c.id === catId);
  const q = cat.questions.find(q => q.id === qId);
  if(q && !q.done){
    pendingDeleteQid = qId;
    render();
    return;
  }
  if(q) archiveDeletedQuestion(cat, q);
  cat.questions = cat.questions.filter(q => q.id !== qId);
  render();
  saveStateToFirebase();
}

function confirmDeleteQuestion(catId, qId){
  const cat = state.categories.find(c => c.id === catId);
  const q = cat ? cat.questions.find(q => q.id === qId) : null;
  pendingDeleteQid = null;
  if(cat && q) archiveDeletedQuestion(cat, q);
  if(cat) cat.questions = cat.questions.filter(q => q.id !== qId);
  render();
  saveStateToFirebase();
}

function cancelDeleteQuestion(){
  pendingDeleteQid = null;
  render();
}

function updateText(catId, qId, field, value){
  const cat = state.categories.find(c => c.id === catId);
  const q = cat.questions.find(q => q.id === qId);
  q[field] = value;
  if(field === 'answer'){
    const temp = document.createElement('div');
    temp.innerHTML = value || '';
    if(temp.textContent.trim() !== ''){
      q.answerBy = currentUser || null;
      q.answerAt = nowHM();
    } else {
      q.answerBy = null;
      q.answerAt = null;
    }
  }
  saveStateToFirebase();
}

function addComment(catId, qId, openNightToo){
  const cat = state.categories.find(c => c.id === catId);
  const q = cat.questions.find(q => q.id === qId);
  if(!q.comments) q.comments = [];
  if(!q.commentMarks) q.commentMarks = [];
  if(!q.commentNights) q.commentNights = [];
  if(!q.commentNightsOn) q.commentNightsOn = [];
  if(!q.commentExtra) q.commentExtra = [];
  if(!q.commentBy) q.commentBy = [];
  if(!q.commentAt) q.commentAt = [];
  if(!q.commentNightsBy) q.commentNightsBy = [];
  if(!q.commentNightsAt) q.commentNightsAt = [];
  q.comments.push('');
  q.commentMarks.push(null);
  q.commentNights.push('');
  q.commentNightsOn.push(!!openNightToo);
  q.commentExtra.push([]);
  q.commentBy.push(null);
  q.commentAt.push(null);
  q.commentNightsBy.push(null);
  q.commentNightsAt.push(null);
  const newIdx = q.comments.length - 1;
  if(openNightToo){
    lastFocusNightQid = qId;
    lastFocusNightIdx = newIdx;
  } else {
    lastFocusCommentQid = qId;
    lastFocusCommentIdx = newIdx;
  }
  render();
  saveStateToFirebase();
}

function updateComment(catId, qId, idx, value){
  const cat = state.categories.find(c => c.id === catId);
  const q = cat.questions.find(q => q.id === qId);
  q.comments[idx] = value;
  if(!q.commentBy) q.commentBy = [];
  if(!q.commentAt) q.commentAt = [];
  if(value && value.trim() !== ''){
    q.commentBy[idx] = currentUser || null;
    q.commentAt[idx] = nowHM();
  } else {
    q.commentBy[idx] = null;
    q.commentAt[idx] = null;
  }
  saveStateToFirebase();
}

// מוסיף פריט נוסף (נייט או מקליד/ה) להמשך השרשור של תגובה מסוימת.
// אם עדיין אין נייט לתגובה הזו ואין אף פריט המשך אחר - "נייט" ממלא את משבצת הנייט הראשונה (כמו קודם).
// בכל מקרה אחר - מתווסף פריט חדש בסוף השרשור, כדי שתמיד יתווסף אחרי הפריט האחרון שכבר קיים ולא לפניו.
function addRowThreadItem(catId, qId, idx, type){
  const cat = state.categories.find(c => c.id === catId);
  const q = cat.questions.find(q => q.id === qId);
  if(!q.commentNightsOn) q.commentNightsOn = [];
  if(!q.commentNights) q.commentNights = [];
  if(!q.commentExtra) q.commentExtra = [];
  while(q.commentExtra.length <= idx) q.commentExtra.push([]);
  if(!q.commentExtra[idx]) q.commentExtra[idx] = [];

  const hasExtraAlready = q.commentExtra[idx].length > 0;

  if(type === 'night' && !q.commentNightsOn[idx] && !hasExtraAlready){
    q.commentNightsOn[idx] = true;
    lastFocusNightQid = qId;
    lastFocusNightIdx = idx;
  } else {
    q.commentExtra[idx].push({id: uid('ex'), type: type, text: '', by: currentUser || null, at: nowHM()});
    lastFocusExtraQid = qId;
    lastFocusExtraIdx = idx;
    lastFocusExtraSub = q.commentExtra[idx].length - 1;
  }
  render();
  saveStateToFirebase();
}

function updateCommentExtra(catId, qId, idx, subIdx, value){
  const cat = state.categories.find(c => c.id === catId);
  const q = cat.questions.find(q => q.id === qId);
  if(!q.commentExtra || !q.commentExtra[idx] || !q.commentExtra[idx][subIdx]) return;
  q.commentExtra[idx][subIdx].text = value;
  if(value && value.trim() !== ''){
    q.commentExtra[idx][subIdx].by = currentUser || null;
    q.commentExtra[idx][subIdx].at = nowHM();
  } else {
    q.commentExtra[idx][subIdx].by = null;
    q.commentExtra[idx][subIdx].at = null;
  }
  saveStateToFirebase();
}

function deleteCommentExtra(catId, qId, idx, subIdx){
  const cat = state.categories.find(c => c.id === catId);
  const q = cat.questions.find(q => q.id === qId);
  if(!q.commentExtra || !q.commentExtra[idx]) return;
  q.commentExtra[idx].splice(subIdx, 1);
  render();
  saveStateToFirebase();
}

function rowAddPopupKey(qId, idx){
  return qId + '|' + idx;
}

function markPopupKey(qId, target, commentIdx, extraSubIdx){
  return qId + '|' + target + '|' + (commentIdx === null || commentIdx === undefined ? '' : commentIdx) + '|' + (extraSubIdx === null || extraSubIdx === undefined ? '' : extraSubIdx);
}

// כפתור מאוחד אחד לשאלה: לחיצה פותחת תפריט נפתח למטה עם "הוסף סעיף" ושורת צבעי מרקר
function buildQuestionMenu(catId, qId, activeColor, showMarker){
  const wrap = document.createElement('span');
  wrap.className = 'question-menu';

  const key = 'qmenu-' + qId;
  const isOpen = openQuestionMenu === key;

  const menuBtn = document.createElement('button');
  menuBtn.className = 'question-menu-btn' + (showMarker && activeColor ? ' dot-' + activeColor : '');
  menuBtn.innerText = '+';
  menuBtn.title = showMarker ? 'הוסף תת-סעיף / סמן במרקר' : 'הוסף תת-סעיף';
  menuBtn.onclick = () => {
    openQuestionMenu = isOpen ? null : key;
    render();
  };
  wrap.appendChild(menuBtn);

  if(isOpen){
    const dropdown = document.createElement('div');
    dropdown.className = 'question-menu-dropdown';

    if(showMarker){
      // אופציה ראשונה: הכפתור הרגיל של המרקר (פותח את הפלטה שלו כרגיל בלחיצה)
      const markRow = document.createElement('div');
      markRow.className = 'question-menu-row';
      markRow.appendChild(buildMarkTools(catId, qId, 'text', activeColor, null));
      dropdown.appendChild(markRow);
    }

    // הוספת תת-סעיף
    const addOpt = document.createElement('button');
    addOpt.className = 'question-menu-add';
    addOpt.innerText = 'תת-סעיף';
    addOpt.onclick = () => {
      openQuestionMenu = null;
      addSubQuestionAfter(catId, qId);
    };
    dropdown.appendChild(addOpt);

    wrap.appendChild(dropdown);
  }

  return wrap;
}

function buildMarkTools(catId, qId, target, activeColor, commentIdx, extraSubIdx){
  const wrap = document.createElement('span');
  wrap.className = 'mark-tools';

  const key = markPopupKey(qId, target, commentIdx, extraSubIdx);
  const isOpen = openMarkPopup === key;

  const penBtn = document.createElement('button');
  penBtn.className = 'mark-pen' + (activeColor ? ' mark-pen-active' : '');
  penBtn.innerHTML = '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18.37 2.63 14 7l-1.59-1.59a2 2 0 0 0-2.82 0L8 6l10 10 1.41-1.59a2 2 0 0 0 0-2.82L18 10l4.37-4.37a2.12 2.12 0 1 0-3-3z"></path><path d="M9 8c-2 3-4 3.5-7 4l8 10c2-1 6-5 6-7"></path></svg><span class="mark-pen-bar' + (activeColor ? ' dot-' + activeColor : '') + '"></span>';
  penBtn.title = 'סמן במרקר';
  penBtn.onclick = () => {
    openMarkPopup = isOpen ? null : key;
    render();
  };
  wrap.appendChild(penBtn);

  if(isOpen){
    const palette = document.createElement('span');
    palette.className = 'mark-palette';

    const clearDot = document.createElement('button');
    clearDot.className = 'mark-dot mark-dot-clear' + (!activeColor ? ' active' : '');
    clearDot.title = 'נקי';
    clearDot.innerHTML = '<svg viewBox="0 0 24 24" width="7" height="7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M4 4 20 20M20 4 4 20"></path></svg>';
    clearDot.onclick = () => {
      openMarkPopup = null;
      clearMark(catId, qId, target, commentIdx, extraSubIdx);
    };
    palette.appendChild(clearDot);

    MARK_COLORS.forEach(color => {
      const dot = document.createElement('button');
      dot.className = 'mark-dot dot-' + color + (activeColor === color ? ' active' : '');
      dot.title = color;
      dot.onclick = () => {
        openMarkPopup = null;
        toggleMark(catId, qId, target, color, commentIdx, extraSubIdx);
      };
      palette.appendChild(dot);
    });
    wrap.appendChild(palette);
  }

  return wrap;
}

function clearMark(catId, qId, target, commentIdx, extraSubIdx){
  const cat = state.categories.find(c => c.id === catId);
  const q = cat.questions.find(q => q.id === qId);
  if(target === 'text'){
    q.textMark = null;
  } else if(target === 'comment'){
    if(!q.commentMarks) q.commentMarks = [];
    q.commentMarks[commentIdx] = null;
  } else if(target === 'extra'){
    if(q.commentExtra && q.commentExtra[commentIdx] && q.commentExtra[commentIdx][extraSubIdx]){
      q.commentExtra[commentIdx][extraSubIdx].mark = null;
    }
  }
  render();
  saveStateToFirebase();
}

function toggleMark(catId, qId, target, color, commentIdx, extraSubIdx){
  const cat = state.categories.find(c => c.id === catId);
  const q = cat.questions.find(q => q.id === qId);
  if(target === 'text'){
    q.textMark = (q.textMark === color) ? null : color;
  } else if(target === 'comment'){
    if(!q.commentMarks) q.commentMarks = [];
    q.commentMarks[commentIdx] = (q.commentMarks[commentIdx] === color) ? null : color;
  } else if(target === 'extra'){
    if(q.commentExtra && q.commentExtra[commentIdx] && q.commentExtra[commentIdx][extraSubIdx]){
      const item = q.commentExtra[commentIdx][extraSubIdx];
      item.mark = (item.mark === color) ? null : color;
    }
  }
  render();
  saveStateToFirebase();
}
